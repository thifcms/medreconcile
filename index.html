<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCogtfOJ-_qlXCGGEqvZ9sRFlfWm_20yao",
    authDomain: "spherical-leaf-vr5vm.firebaseapp.com",
    projectId: "spherical-leaf-vr5vm",
    storageBucket: "spherical-leaf-vr5vm.firebasestorage.app",
    messagingSenderId: "572028997371",
    appId: "1:572028997371:web:86d2fc27b2f6d4e529ea5e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app, "ai-studio-07b01720-0a41-4e0a-89f7-93e327ec5916");
  const provider = new GoogleAuthProvider();
  provider.addScope('https://www.googleapis.com/auth/drive.file');

  let _driveToken = localStorage.getItem('med_drive_token');
  window.setDriveToken = (t) => { _driveToken = t; t ? localStorage.setItem('med_drive_token', t) : localStorage.removeItem('med_drive_token'); };
  window.getDriveToken = () => _driveToken;
  window.GoogleAuthProvider = GoogleAuthProvider;
  window.signInWithPopup = signInWithPopup;
  window.signInWithRedirect = signInWithRedirect;
  window.getRedirectResult = getRedirectResult;
  window.isStandalonePWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  window.fbAuth = auth;
  window.fbDb = db;
  window.fbProvider = provider;
  window.fbSignIn = () => signInWithPopup(auth, provider);
  window.fbSignOut = () => signOut(auth);
  window.fbOnAuth = (cb) => onAuthStateChanged(auth, cb);
  window.fbSaveData = async (userId, data) => {
    await setDoc(doc(db, "users", userId, "data", "medreconcile"), data);
  };
  window.fbLoadData = async (userId) => {
    const snap = await getDoc(doc(db, "users", userId, "data", "medreconcile"));
    return snap.exists() ? snap.data() : null;
  };

  console.log("Firebase inicializado!");
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>MedReconcile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#e8ecee;
  --glass:rgba(255,255,255,0.68);
  --border:rgba(255,255,255,0.75);
  --text:#1a1c1e;
  --text2:#3b3e42;
  --text3:#8a9099;
  --lead:#4b5259;
  --lead2:#272d32;
  --lead3:#1e2528;
  --green:#2ec866;
  --green2:#1fa050;
  --greenglow:#39e874;
  --red:#d94040;
  --orange:#d97a00;
  --shadow:0 4px 24px rgba(0,0,0,0.08);
  --shadow2:0 8px 40px rgba(0,0,0,0.14);
  --blur:blur(24px) saturate(180%);
  --radius:18px;
}
body{font-family:'Nunito',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
input,select,button{font-family:inherit;}
button{cursor:pointer;}

/* ── MESH BACKGROUND ── */
.mesh-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 8% 12%,rgba(46,200,102,0.055) 0%,transparent 65%),
    radial-gradient(ellipse 50% 55% at 92% 18%,rgba(46,200,102,0.028) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 78% 88%,rgba(75,82,89,0.04) 0%,transparent 60%),
    radial-gradient(ellipse 40% 45% at 28% 78%,rgba(46,200,102,0.032) 0%,transparent 55%),
    linear-gradient(160deg,#eaedeb 0%,#eceef0 50%,#e9ecee 100%);}
.mesh-bg::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle 280px at 72% 28%,rgba(46,200,102,0.035) 0%,transparent 70%),
    radial-gradient(circle 200px at 18% 62%,rgba(46,200,102,0.025) 0%,transparent 70%);}

/* ── GLASS ── */
.glass{
  background:linear-gradient(145deg,rgba(255,255,255,0.72) 0%,rgba(255,255,255,0.58) 100%);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,0.75);border-radius:22px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,0.85);}

/* ── BUTTONS ── */
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:16px;border:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#35d46e 0%,#22a852 60%,#1a8f45 100%);
  box-shadow:0 6px 22px rgba(46,200,102,0.42),inset 0 1px 0 rgba(255,255,255,0.28);
  position:relative;overflow:hidden;transition:all 0.2s;}
.btn-p::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.32),transparent);
  transform:skewX(-20deg);transition:left 0.5s ease;}
.btn-p:hover::before{left:130%;}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(46,200,102,0.52);}
.btn-p:active{transform:scale(0.97);}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-g{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;border-radius:14px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;color:var(--lead);
  background:linear-gradient(135deg,rgba(255,255,255,0.58),rgba(255,255,255,0.38));
  border:1px solid rgba(255,255,255,0.70);
  box-shadow:0 2px 8px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.75);
  transition:all 0.18s;}
.btn-g:hover{background:rgba(255,255,255,0.82);transform:translateY(-1px);}
.btn-g:active{transform:scale(0.97);}
.btn-d{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 12px;border-radius:11px;cursor:pointer;font-family:inherit;
  font-size:12px;font-weight:700;color:var(--red);
  background:rgba(217,64,64,0.07);border:1px solid rgba(217,64,64,0.14);transition:all 0.18s;}
.btn-d:hover{background:rgba(217,64,64,0.13);}

/* ── INPUT ── */
.input{width:100%;padding:13px 15px;border-radius:13px;
  border:1.5px solid rgba(255,255,255,0.68);
  background:linear-gradient(145deg,rgba(255,255,255,0.82),rgba(255,255,255,0.65));
  box-shadow:inset 0 1px 4px rgba(0,0,0,0.05),0 1px 0 rgba(255,255,255,0.82);
  font-family:inherit;font-size:15px;color:var(--text);outline:none;transition:all 0.18s;}
.input:focus{border-color:rgba(46,200,102,0.55);background:rgba(255,255,255,0.94);
  box-shadow:0 0 0 4px rgba(46,200,102,0.12),inset 0 1px 4px rgba(0,0,0,0.04);}
.input::placeholder{color:var(--text3);}
select.input{cursor:pointer;appearance:none;}

/* ── LABELS & BADGES ── */
.lbl{font-size:11px;font-weight:800;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.badge-g{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;background:rgba(46,200,102,0.12);color:#1a7a3c;border:1px solid rgba(46,200,102,0.18);}
.badge-l{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;background:rgba(75,82,89,0.10);color:var(--lead);}
.badge-o{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;background:rgba(217,122,0,0.10);color:var(--orange);}

/* ── NAV ── */
.nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:2px;padding:6px;
  background:linear-gradient(160deg,#323a40 0%,#222930 60%,var(--lead3) 100%);
  border-radius:24px;border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 10px 40px rgba(0,0,0,0.30),inset 0 1px 0 rgba(255,255,255,0.06);
  z-index:50;width:calc(100% - 40px);max-width:420px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 4px;border-radius:16px;border:none;cursor:pointer;
  background:transparent;color:rgba(255,255,255,0.35);
  font-size:9px;font-weight:800;font-family:inherit;
  transition:all 0.22s cubic-bezier(0.34,1.4,0.64,1);}
.nav-btn svg{width:20px;height:20px;}
.nav-btn.active{background:linear-gradient(135deg,#35d46e,#22a852,#1a8f45);
  color:#fff;box-shadow:0 4px 16px rgba(46,200,102,0.52),inset 0 1px 0 rgba(255,255,255,0.22);}
.nav-btn:hover:not(.active){color:rgba(255,255,255,0.72);}

/* ── TOASTS ── */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{padding:13px 18px;border-radius:14px;font-size:14px;font-weight:700;max-width:300px;
  background:linear-gradient(145deg,rgba(255,255,255,0.94),rgba(255,255,255,0.82));
  backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,0.80);
  box-shadow:0 8px 32px rgba(0,0,0,0.12);display:flex;align-items:center;gap:10px;
  animation:fadeUp 0.28s ease both;}
.toast-success{border-left:4px solid var(--green);}
.toast-error{border-left:4px solid var(--red);}
.toast-info{border-left:4px solid var(--lead);}

/* ── PIN ── */
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
.pin-key{aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,0.90),rgba(255,255,255,0.68));
  color:var(--text);font-size:20px;font-weight:700;font-family:inherit;
  box-shadow:0 3px 12px rgba(0,0,0,0.09),inset 0 1px 0 rgba(255,255,255,0.92);
  transition:all 0.14s cubic-bezier(0.34,1.56,0.64,1);}
.pin-key:active{transform:scale(0.88);background:linear-gradient(135deg,#35d46e,#22a852);color:#fff;box-shadow:0 4px 18px rgba(46,200,102,0.42);}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(46,200,102,0.40);transition:all 0.18s;}
.pin-dot.filled{background:var(--green);border-color:var(--green);transform:scale(1.15);box-shadow:0 0 8px rgba(46,200,102,0.50);}

/* ── SPLASH 3D ── */
.splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#e6ebe8 0%,#eceef0 50%,#e8ecee 100%);overflow:hidden;}
.splash-bg{position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 20% 20%,rgba(46,200,102,0.08) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%,rgba(75,82,89,0.06) 0%,transparent 55%);
  animation:splashBgPulse 3s ease-in-out infinite alternate;}
@keyframes splashBgPulse{from{opacity:.6;}to{opacity:1;}}
.splash-scene{perspective:800px;perspective-origin:50% 50%;margin-bottom:36px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}
.splash-logo-3d{width:108px;height:108px;transform-style:preserve-3d;
  animation:logo3dEnter 1.6s cubic-bezier(0.34,1.2,0.64,1) both, logo3dFloat 4s ease-in-out 1.6s infinite alternate;}
@keyframes logo3dEnter{
  0%{transform:rotateX(-90deg) rotateY(30deg) scale(0.3);opacity:0;}
  40%{transform:rotateX(12deg) rotateY(-8deg) scale(1.05);opacity:1;}
  65%{transform:rotateX(-6deg) rotateY(4deg) scale(0.98);}
  80%{transform:rotateX(3deg) rotateY(-2deg) scale(1.01);}
  100%{transform:rotateX(0deg) rotateY(0deg) scale(1);opacity:1;}}
@keyframes logo3dFloat{
  from{transform:rotateX(0deg) rotateY(-4deg) translateY(0px);}
  to{transform:rotateX(4deg) rotateY(4deg) translateY(-7px);}}
.splash-logo-face{width:108px;height:108px;border-radius:32px;
  background:linear-gradient(145deg,#f0f2f0 0%,#e2e6e3 100%);
  box-shadow:0 22px 64px rgba(0,0,0,0.14),0 6px 20px rgba(0,0,0,0.08),inset 0 2px 0 rgba(255,255,255,0.92),inset 0 -2px 0 rgba(0,0,0,0.06);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.splash-logo-face::before{content:'';position:absolute;top:-30%;left:-30%;width:60%;height:60%;
  background:radial-gradient(ellipse,rgba(255,255,255,0.82) 0%,transparent 70%);border-radius:50%;
  animation:sheenMove 4s ease-in-out 1.6s infinite alternate;}
@keyframes sheenMove{from{transform:translate(0,0);}to{transform:translate(22px,16px);}}
.splash-logo-shadow{width:88px;height:18px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,0.12) 0%,transparent 70%);margin-top:10px;
  animation:shadowPulse 4s ease-in-out 1.6s infinite alternate;}
@keyframes shadowPulse{from{transform:scaleX(1);opacity:.7;}to{transform:scaleX(.84);opacity:.38;}}
.splash-title{font-size:30px;font-weight:900;letter-spacing:-0.8px;color:var(--text);
  opacity:0;transform:translateY(16px);animation:textReveal 0.6s cubic-bezier(0.34,1.4,0.64,1) 1.1s both;z-index:1;}
.splash-sub{font-size:13px;color:var(--text3);font-weight:600;margin-top:7px;letter-spacing:0.3px;
  opacity:0;transform:translateY(10px);animation:textReveal 0.5s cubic-bezier(0.34,1.4,0.64,1) 1.3s both;z-index:1;}
@keyframes textReveal{to{opacity:1;transform:translateY(0);}}
.splash-dots{display:flex;gap:6px;margin-top:40px;opacity:0;animation:textReveal 0.4s ease 1.6s both;z-index:1;}
.splash-dot{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:.3;animation:dotPulse 1.2s ease-in-out infinite;}
.splash-dot:nth-child(2){animation-delay:.2s;}.splash-dot:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{0%,100%{opacity:.25;transform:scale(.85);}50%{opacity:1;transform:scale(1.2);background:var(--greenglow);}}
.splash.exit{animation:splashExit .55s cubic-bezier(.4,0,1,1) both;}
@keyframes splashExit{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.06);pointer-events:none;}}

/* ── SWIPE ── */
#content{touch-action:pan-y;user-select:none;}
.swipe-anim-left{animation:swipeLeft 0.22s cubic-bezier(0.4,0,0.2,1) both;}
.swipe-anim-right{animation:swipeRight 0.22s cubic-bezier(0.4,0,0.2,1) both;}
@keyframes swipeLeft{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
@keyframes swipeRight{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}

/* ── TOPBAR ── */
.topbar{padding:18px 20px 14px;position:sticky;top:0;z-index:40;
  background:linear-gradient(145deg,rgba(255,255,255,0.72),rgba(255,255,255,0.55));
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid rgba(255,255,255,0.75);
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 20px rgba(0,0,0,0.06);}
.topbar-logo{width:42px;height:42px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(145deg,#f0f2f0,#e4e8e5);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.10),inset 0 1px 0 rgba(255,255,255,0.90);}
.topbar-avatar{width:42px;height:42px;border-radius:21px;flex-shrink:0;
  background:linear-gradient(135deg,#35d46e,#1a8f45);
  border:2px solid rgba(255,255,255,0.85);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:16px;cursor:pointer;
  box-shadow:0 6px 18px rgba(46,200,102,0.42),inset 0 1px 0 rgba(255,255,255,0.28);}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shimLoad{0%{transform:translateX(-200%);}100%{transform:translateX(400%);}}
.anim-up{animation:fadeUp 0.32s cubic-bezier(0.34,1.4,0.64,1) both;}
.spin{animation:spin 0.8s linear infinite;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.10);border-radius:4px;}

/* ── HERO CONCIL ── */
.hero-concil{background:linear-gradient(135deg,#2ec866,#1a8f45);border-radius:26px;padding:26px;
  box-shadow:0 18px 44px rgba(46,200,102,0.32);position:relative;overflow:hidden;margin-bottom:16px;}
.hero-concil::after{content:'📊';position:absolute;top:-20px;right:-16px;font-size:110px;opacity:.08;pointer-events:none;}

/* ── RELATÓRIO BARS ── */
.rel-bar{height:5px;background:rgba(0,0,0,0.07);border-radius:3px;overflow:hidden;margin-top:8px;}
.rel-bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .6s ease;}

/* ── ALERTA BADGE ── */
.alert-30{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:800;background:rgba(217,122,0,0.10);color:var(--orange);
  border:1px solid rgba(217,122,0,0.18);margin-top:4px;}
.alert-60{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:800;background:rgba(217,64,64,0.10);color:var(--red);
  border:1px solid rgba(217,64,64,0.18);margin-top:4px;}

/* ── OFFLINE BANNER ── */
.offline-banner{background:rgba(217,64,64,0.09);border:1px solid rgba(217,64,64,0.20);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
</style>
</head>

<div class="mesh-bg"></div>
<div class="toast-wrap" id="toasts"></div>

<div id="login-screen" style="display:none;max-width:480px;margin:0 auto;position:relative;z-index:1;"></div>

<!-- APP -->
<div id="app" style="display:none;max-width:480px;margin:0 auto;min-height:100vh;position:relative;">

  <!-- TOPBAR -->

          <rect x="36" y="8" width="4" height="12" rx="2" fill="#2ec866" opacity="0.9"/>

// Rotas descobertas automaticamente
const AI_ROUTES = {

};

// Service Discovery — aprende os caminhos do Audit AI automaticamente (sem chave)
async function discoverAIRoutes(){
  try {
    const res = await fetch(`${AI_URL}/api/routes`); // endpoint público
    if(res.ok){
      const data = await res.json();
      if(data.routes) Object.assign(AI_ROUTES, data.routes);

      console.log('[MedReconcile] Rotas descobertas automaticamente:', AI_ROUTES);

      window._aiRoutes = data;

}

// ── PICKER DE MÊS/ANO (estilo roleta) ───────────────────────────────────────
const NOMES_MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function openMesPicker(target){

  const atual = target==='pagos' ? state.pagosFiltro : state.mesFiltro;
  let mesIni = null, anoIni = anosDisponiveis.length ? anosDisponiveis[anosDisponiveis.length-1] : new Date().getFullYear();

    const [mm,yy] = atual.split('/');

  state.mesPickerTarget = target;
  state.mesPickerTempMes = mesIni;
  state.mesPickerTempAno = anoIni;

}
let ignoreNextPopstate = false;
function popNavLayer(){
  // Fechamento manual (via botão, não via gesto voltar): sincroniza a pilha e o histórico,
  // mas ignora o popstate que isso vai disparar (já fechamos o modal manualmente).
  if(navStack.length>1){
    navStack.pop();
    ignoreNextPopstate = true;
    try{ history.back(); }catch(_){ ignoreNextPopstate=false; }

}
function closeMesPicker(){ state.showMesPicker=false; popNavLayer(); render(); }
function confirmMesPicker(){

}
function mesPickerSetTodos(){ state.mesPickerTempMes=null; render(); }

  </div>`;
}

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const ic = type==='success'?'✓':type==='error'?'✕':'ℹ';
  el.innerHTML = `<span>${ic}</span>${msg}`;
  document.getElementById('toasts').appendChild(el);

}

// ── NAV ────────────────────────────────────────────────────────────────────────
const TITLES = {inicio:'MedReconcile',unidades:'Unidades Médicas',atendimentos:'Pacientes',auditagem:'Conciliação',config:'Perfil & Ajustes'};
const TAB_ORDER = ['inicio','unidades','atendimentos','auditagem','config'];

// ── HISTÓRICO DO NAVEGADOR (botão voltar do Android) ────────────────────────
// Pilha de "camadas" abertas: modais/telas extras ficam no topo, abas ficam embaixo.
// Ao pressionar voltar: fecha a camada do topo primeiro; só sai do app quando a pilha esvazia
// e já está na primeira aba visitada.
// Estratégia: sempre que ainda há algo na pilha lógica (navStack), garantimos que existe
// uma entrada real no histórico do navegador para "absorver" o próximo voltar. Isso é
// necessário porque PWAs abertos direto (sem navegação orgânica) começam com histórico raso.
let navStack = ['tab:'+state.activeTab];
let suppressPushOnPop = false;

function isAnyModalOpen(){
  return !!(state.showMesPicker || state.showPagosView || state.showRetornosView ||
            state.showForm || state.batchPreview || state.showOrfaosConfirm ||
            state.showResetConfirm || (document.getElementById('patient-modal') && document.getElementById('patient-modal').style.display==='flex'));
}
function ensureHistoryAnchor(){
  // Garante que sempre exista uma entrada no histórico real para interceptar o próximo "voltar",
  // enquanto a pilha lógica (navStack) ainda tiver mais de 1 item.
  try{ history.pushState({navAnchor:true, depth:navStack.length}, '', location.href); }catch(_){}
}
function pushNavLayer(label){
  navStack.push(label);
  ensureHistoryAnchor();
}
function closeTopModalLayer(){
  // Fecha por prioridade a camada de modal mais "recente" visível
  if(state.showMesPicker){ state.showMesPicker=false; render(); return true; }
  if(state.showOrfaosConfirm){ state.showOrfaosConfirm=false; render(); return true; }
  if(state.showResetConfirm){ state.showResetConfirm=false; render(); return true; }
  if(state.batchPreview){ state.batchPreview=null; state.batchDate=null; render(); return true; }
  if(state.showForm){ state.showForm=false; state.editId=null; render(); return true; }
  if(state.showRetornosView){ state.showRetornosView=false; render(); return true; }
  if(state.showPagosView){ state.showPagosView=false; render(); return true; }
  const pm = document.getElementById('patient-modal');
  if(pm && pm.style.display==='flex'){ pm.style.display='none'; return true; }
  return false;
}
window.addEventListener('popstate', ()=>{
  if(ignoreNextPopstate){ ignoreNextPopstate=false; return; }
  // 1) Tenta fechar a camada de modal mais no topo
  if(closeTopModalLayer()){
    if(navStack.length>1) navStack.pop();
    // Ainda há itens na pilha lógica? Garante âncora no histórico para o próximo voltar.
    if(navStack.length>1) ensureHistoryAnchor();
    return;
  }
  // 2) Sem modais abertos: volta para a aba anterior na pilha, se houver
  if(navStack.length>1){
    navStack.pop();
    const top = navStack[navStack.length-1];
    if(top && top.startsWith('tab:')){
      const tab = top.slice(4);
      state.activeTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      const nb = document.getElementById('nav-'+tab);
      if(nb) nb.classList.add('active');
      const activeH = state.hospitals.find(h=>h.id===state.activeHosp);
      document.getElementById('topbar-title').textContent = (tab==='atendimentos'&&activeH) ? activeH.name : TITLES[tab];
      render();
    }
    // Ainda há mais de 1 aba na pilha? Garante âncora para o próximo voltar.
    if(navStack.length>1) ensureHistoryAnchor();
  }
  // 3) Se a pilha esvaziou (navStack.length<=1), não recriamos âncora: deixa o navegador
  // seguir o comportamento padrão (sair do app) na próxima vez que apertar voltar.
});

function showTab(tab, direction){
  if(tab !== state.activeTab) pushNavLayer('tab:'+tab);
  state.activeTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb = document.getElementById('nav-'+tab);
  if(nb) nb.classList.add('active');
  const activeH = state.hospitals.find(h=>h.id===state.activeHosp);
  document.getElementById('topbar-title').textContent = (tab==='atendimentos'&&activeH) ? activeH.name : TITLES[tab];
  render();
  // Apply swipe animation
  if(direction){
    const el = document.getElementById('content');
    el.classList.remove('swipe-anim-left','swipe-anim-right');
    void el.offsetWidth;
    el.classList.add(direction==='left'?'swipe-anim-left':'swipe-anim-right');
  }
}

// ── SWIPE GESTURE ────────────────────────────────────────────────────────────
let swipeStartX = 0;
let swipeStartY = 0;
let swipeActive = false;

document.addEventListener('DOMContentLoaded', () => {
  const content = document.getElementById('content');
  if(!content) return;

  content.addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeActive = true;
  }, {passive:true});

  content.addEventListener('touchmove', e => {
    if(!swipeActive) return;
    const dx = e.touches[0].clientX - swipeStartX;
    const dy = e.touches[0].clientY - swipeStartY;
    // Cancel if mostly vertical scroll
    if(Math.abs(dy) > Math.abs(dx)) { swipeActive = false; }
  }, {passive:true});

  content.addEventListener('touchend', e => {
    if(!swipeActive) return;
    swipeActive = false;
    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;
    if(Math.abs(dx) < 90 || Math.abs(dy) > Math.abs(dx)*0.8) return;
    const cur = TAB_ORDER.indexOf(state.activeTab);
    if(dx < 0 && cur < TAB_ORDER.length-1) {
      // Swipe left → next tab
      showTab(TAB_ORDER[cur+1], 'left');
    } else if(dx > 0 && cur > 0) {
      // Swipe right → previous tab
      showTab(TAB_ORDER[cur-1], 'right');
    }
  }, {passive:true});
});

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const c = document.getElementById('content');
  if(state.activeTab==='inicio') c.innerHTML = renderInicio();
  else if(state.activeTab==='unidades') c.innerHTML = renderUnidades();
  else if(state.activeTab==='atendimentos') c.innerHTML = renderAtendimentos();
  else if(state.activeTab==='auditagem') c.innerHTML = renderAuditagem();
  else if(state.activeTab==='config') c.innerHTML = renderConfig();
  bindEvents();
}

// ── INÍCIO ────────────────────────────────────────────────────────────────────

  const pagos = hospAtts.filter(p=>p.status==='PAGO');

  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">

        <div style="font-size:12px;color:var(--text3);font-weight:700;margin-top:4px;">Unidades</div>
      </div>
      <div class="glass anim-up" style="padding:20px 16px;text-align:center;background:linear-gradient(145deg,rgba(46,200,102,0.08),rgba(46,200,102,0.04));">
        <div style="font-size:36px;font-weight:900;color:var(--green2);">${totalPac}</div>
        <div style="font-size:12px;color:var(--text3);font-weight:700;margin-top:4px;">Pacientes</div>
      </div>
    </div>

    ${activeH ? `
    <div class="glass anim-up" style="padding:16px 18px;margin-bottom:20px;border-left:3px solid var(--green);">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#35d46e,#1a8f45);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 16px rgba(46,200,102,0.35);">🏥</div>
        <div style="flex:1;">
          <div style="font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;">Unidade Ativa</div>
          <div style="font-weight:900;font-size:15px;color:var(--text);margin-top:2px;">${activeH.name}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:13px;font-weight:800;color:var(--orange);">${pendentes.length} pendentes</div>
          <div style="font-size:12px;color:var(--green2);font-weight:700;">${pagos.length} pagos</div>

      </div>
    </div>` : `
    <div class="glass anim-up" style="padding:16px 18px;margin-bottom:20px;border-left:3px solid rgba(75,82,89,0.20);">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,0.60);display:flex;align-items:center;justify-content:center;font-size:20px;">🏨</div>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--text2);">Nenhuma unidade ativa</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px;">Selecione uma unidade para começar</div>

// ── UNIDADES ──────────────────────────────────────────────────────────────────
function renderUnidades(){
  const hosps = state.hospitals;
  return `
    <div class="glass anim-up" style="padding:20px;margin-bottom:20px;">
      <div class="lbl">Nova Unidade</div>
      <input class="input" id="inp-hosp" placeholder="Nome do hospital ou clínica" style="margin-bottom:12px;">
      <button class="btn-p" style="width:100%;" onclick="addHosp()">+ Cadastrar Unidade</button>
    </div>
    <div class="lbl" style="margin-bottom:12px;">Unidades Habilitadas (${hosps.length})</div>
    ${hosps.length===0?`
      <div class="glass" style="padding:48px;text-align:center;">
        <div style="font-size:48px;margin-bottom:12px;">🏨</div>
        <div style="font-weight:800;color:var(--text2);">Nenhuma unidade cadastrada</div>
        <div style="font-size:13px;color:var(--text3);margin-top:6px;">Cadastre o hospital onde você atende.</div>
      </div>`:''}
    ${hosps.map(h=>{
      const isActive = state.activeHosp===h.id;
      const pats = state.patients.filter(p=>p.hospId===h.id);
      const pend = pats.filter(p=>p.status!=='PAGO'&&p.status!=='RETORNO').length;
      const pago = pats.filter(p=>p.status==='PAGO').length;
      return `
      <div class="glass anim-up" style="padding:16px 18px;margin-bottom:12px;${isActive?'border-left:3px solid var(--green);background:rgba(46,200,102,0.03);':''}">
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:46px;height:46px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;
            ${isActive?'background:linear-gradient(135deg,#35d46e,#1a8f45);box-shadow:0 8px 20px rgba(46,200,102,0.38);':'background:linear-gradient(145deg,rgba(255,255,255,0.80),rgba(255,255,255,0.55));box-shadow:var(--shadow);'}">🏥</div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:900;font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${h.name}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:3px;">
              <div style="font-size:12px;font-weight:700;color:${isActive?'var(--green2)':'var(--text3)'};">${isActive?'● Ativa':'Inativa'}</div>
              ${pats.length>0?`<div style="font-size:11px;color:var(--text3);font-weight:600;">${pend} pendentes · ${pago} pagos</div>`:''}
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0;">
            ${isActive
              ? `<div style="padding:7px 12px;border-radius:10px;background:rgba(46,200,102,0.10);border:1px solid rgba(46,200,102,0.20);">
                  <div style="font-size:11px;font-weight:800;color:var(--green2);">✓ Selecionada</div>
                </div>`
              : `<button class="btn-g" style="padding:8px 14px;font-size:12px;" onclick="activateHosp('${h.id}')">
                  ${state.activeHosp ? 'Trocar' : 'Ativar'}
                </button>`
            }
            ${confirmDeleteHospId===h.id ? `
              <button onclick="confirmDeleteHospId=null;render();" style="padding:7px 10px;border-radius:10px;border:none;font-size:12px;font-weight:800;cursor:pointer;background:rgba(255,255,255,0.70);color:var(--lead);font-family:inherit;">Cancelar</button>
              <button onclick="removeHosp('${h.id}')" style="padding:7px 12px;border-radius:10px;border:none;font-size:12px;font-weight:800;cursor:pointer;background:var(--red);color:#fff;font-family:inherit;">Excluir</button>
            ` : `
              <button class="btn-d" style="padding:8px 12px;" onclick="confirmDeleteHospId='${h.id}';render()">🗑</button>
            `}
          </div>
        </div>
      </div>`;
    }).join('')}`;
}
function addHosp(){const n=document.getElementById('inp-hosp').value.trim();if(!n)return;state.hospitals.push({id:uid(),name:n});saveState();render();toast('Unidade adicionada!','success');}
function removeHosp(id){state.hospitals=state.hospitals.filter(h=>h.id!==id);if(state.activeHosp===id)state.activeHosp=null;confirmDeleteHospId=null;saveState();render();toast('Unidade removida','info');}
function activateHosp(id){
  state.activeHosp=id;saveState();
  const h = state.hospitals.find(h=>h.id===id);
  showTab('atendimentos');
  toast('Unidade ativa: '+( h?h.name:''),'success');
}

// ── ATENDIMENTOS ──────────────────────────────────────────────────────────────
function renderAtendimentos(){
  if(!state.activeHosp) return `<div class="glass anim-up" style="padding:48px;text-align:center;"><div style="font-size:48px;margin-bottom:12px;">🏢</div><div style="font-weight:800;color:var(--text2);">Nenhuma unidade ativa</div><div style="font-size:13px;color:var(--text3);margin-top:6px;">Selecione um hospital na aba Início.</div></div>`;
  const all = state.patients.filter(p=>p.hospId===state.activeHosp);
  const MESES = ['TODOS',...Array.from(new Set(all.map(a=>{if(!a.data)return null;const d=new Date(a.data);return`${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;})).values()).filter(Boolean)].sort();
  const filtered = state.mesFiltro==='TODOS' ? all : all.filter(a=>{if(!a.data)return false;const d=new Date(a.data);return`${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`===state.mesFiltro;});
  const pendentes = filtered.filter(a=>a.status!=='PAGO'&&a.status!=='RETORNO');
  const pagos = filtered.filter(a=>a.status==='PAGO');
  const tPend = pendentes.reduce((s,a)=>s+(a.valor||0),0);
  const tPago = pagos.reduce((s,a)=>s+(a.valorPago||a.valor||0),0);
  const CONVENIOS = ['Unimed','Amil','Bradesco Saúde','SulAmérica','Porto Seguro','Prevent Senior','NotreDame Intermédica','Hapvida','Particular','Outro'];
  const porConvenio = CONVENIOS.map(c=>({c,pend:pendentes.filter(a=>a.convenio===c),pago:pagos.filter(a=>a.convenio===c)})).filter(x=>x.pend.length+x.pago.length>0);

    ${state.batchPreview?`

      <div style="margin-bottom:14px;">

        <input type="date" class="input" id="batch-date" value="${state.batchDate || today()}"
          onchange="setBatchDate(this.value)"
          style="font-size:14px;">
      </div>

      ${state.batchPreview.map((p,i)=>`
        <div style="background:rgba(255,255,255,0.60);border-radius:12px;padding:10px 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.70);">

        </div>`).join('')}
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn-p" style="flex:1;" onclick="confirmarLote()">✓ Salvar todos</button>
        <button class="btn-g" onclick="state.batchPreview=null;state.batchDate=null;popNavLayer();render();">Cancelar</button>
      </div>
    </div>`:''}

    ${state.showForm?`
    <div class="glass anim-up" style="padding:20px;margin-bottom:16px;border-left:3px solid var(--green);">
      <div style="font-size:14px;font-weight:900;color:var(--green2);margin-bottom:16px;">${state.editId?'✎ Editar':'+ Novo'} Atendimento</div>

      <select class="input" id="f-conv" style="margin-bottom:10px;">

      <div style="display:flex;gap:10px;">
        <button class="btn-p" style="flex:1;" onclick="savePatient()">${state.editId?'Salvar':'Confirmar'}</button>
        <button class="btn-g" onclick="state.showForm=false;state.editId=null;popNavLayer();render();">Cancelar</button>

    </div>`:''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">

    })()}
    ${renderMesPickerModal()}

async function handleExcelImport(input){
  const file = input.files[0];
  if(!file) return;
  toast('Lendo planilha...','info');
  try {
    const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf,{type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    if(!rows.length){ toast('Planilha vazia','error'); return; }

    // Tenta mapear colunas automaticamente
    const nn = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').trim();
    const findCol = (row, keywords) => Object.keys(row).find(k=>keywords.some(kw=>nn(k).includes(nn(kw))));

    const firstRow = rows[0];
    const colNome   = findCol(firstRow,['nome','paciente','patient']);
    const colAtd    = findCol(firstRow,['atendimento','protocolo','numero','atend']);
    const colConv   = findCol(firstRow,['convenio','plano','operadora']);
    const colData   = findCol(firstRow,['data','date']);

    const imported = rows.map(r=>({
      nome: colNome ? String(r[colNome]||'') : '',
      atendimento: colAtd ? String(r[colAtd]||'') : '',
      convenio: colConv ? String(r[colConv]||'') : '',
      data: colData ? today() : today()
    })).filter(r=>r.nome||r.atendimento);

    if(!imported.length){ toast('Nenhum paciente encontrado na planilha','error'); return; }

    state.batchPreview = imported;
    pushNavLayer('modal:batchPreview');
    render();
    toast(`${imported.length} pacientes encontrados — revise e confirme`,'success');
  } catch(e) {
    toast('Erro ao ler planilha: '+e.message,'error');
    console.error(e);
  }
}

// ── COMPRESSÃO DE IMAGEM E SUPORTE HEIC ─────────────────────────────────────
function isHeicFile(file){
  const name = (file.name||'').toLowerCase();
  return name.endsWith('.heic') || name.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';
}
async function resizeImageToBase64(file, maxSide=1200, quality=0.85){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(objectUrl);
      let width = img.width, height = img.height;
      if(width > height){ if(width > maxSide){ height = Math.round(height*maxSide/width); width = maxSide; } }
      else { if(height > maxSide){ width = Math.round(width*maxSide/height); height = maxSide; } }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      if(!ctx){ reject(new Error('Não foi possível processar a imagem')); return; }
      ctx.drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); reject(new Error('Falha ao carregar a imagem')); };
    img.src = objectUrl;
  });
}
async function prepareFileForUpload(file){
  // PDFs e HEIC: envia como está (sem recompressão por canvas, que não suporta esses formatos)
  if(file.type === 'application/pdf'){
    if(file.size > 8*1024*1024) throw new Error('PDF muito grande (máx. 8MB). Tire uma foto da página em vez de enviar o PDF.');
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { base64, mimeType: 'application/pdf' };
  }
  if(isHeicFile(file)){
    if(file.size > 10*1024*1024) throw new Error('Imagem HEIC muito grande (máx. 10MB). Reduza a qualidade da foto na câmera.');
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { base64, mimeType: file.type || 'image/heic' };
  }
  // Imagens comuns (jpg, png, etc): comprime para economizar dados e cota da IA
  try {
    return await resizeImageToBase64(file, 1200, 0.85);
  } catch(e){
    // Fallback: se a compressão falhar por algum motivo, envia o arquivo original
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { base64, mimeType: file.type || 'image/jpeg' };
  }
}
function friendlyAiError(status, rawMessage){
  const msg = (rawMessage||'').toLowerCase();
  if(status===429 || msg.includes('quota') || msg.includes('resource_exhausted')){
    return 'Limite de uso da IA atingido temporariamente. Aguarde 1 minuto e tente novamente.';
  }
  if(status===401 || status===403 || msg.includes('invalid') && msg.includes('key')){
    return 'Chave de acesso à IA inválida ou expirada. Verifique a configuração em Ajustes.';
  }
  if(status===413 || msg.includes('too large') || msg.includes('payload')){
    return 'Arquivo muito grande para processar. Tire uma foto mais simples ou em menor resolução.';
  }
  if(status>=500){
    return 'O servidor de IA está indisponível no momento. Tente novamente em alguns instantes.';
  }
  if(msg.includes('failed to fetch') || msg.includes('network')){
    return 'Falha de conexão. Verifique sua internet e tente novamente.';
  }
  return 'Erro ao processar imagem. Tente novamente.';
}

      let pacientes = [];
      const dataNode = a.data || a; // suporta resposta com ou sem nó 'data'

      if(dataNode.etiquetas && Array.isArray(dataNode.etiquetas) && dataNode.etiquetas.length > 0){
        pacientes = dataNode.etiquetas; // formato principal do Audit AI
      } else if(dataNode.pacientes && Array.isArray(dataNode.pacientes)){
        pacientes = dataNode.pacientes;
      } else if(Array.isArray(dataNode)){
        pacientes = dataNode;
      } else if(dataNode.nome_paciente || dataNode.nome){
        pacientes = [dataNode]; // único paciente
      } else {
        // Tenta encontrar qualquer array na resposta
        const arr = Object.values(dataNode).find(v => Array.isArray(v) && v.length > 0);
        if(arr) pacientes = arr;
      }

      const mapped = pacientes.map(p=>{
        const conv = p.convenio || p.plano || p.plano_saude || p.nome_convenio || p.operadora || p.seguradora || p.plano_de_saude || '';
        if(!conv) console.warn('[MedReconcile] Convenio vazio para:', p);
        return {
          nome: p.nome_paciente || p.nome || p.paciente || '',
          atendimento: p.numero_atendimento || p.atendimento || p.num_atendimento || p.id_atendimento || '',
          convenio: conv,
          data: p.data_atendimento || p.data_internacao || p.data || today(),
          aiSourceHash: imageHash
        };
      }).filter(p=>p.nome||p.atendimento);

      allPacientes.push(...mapped);
      console.log(`[MedReconcile] Foto ${fi+1}/${files.length}: ${mapped.length} pacientes`);
    } // fim do loop de arquivos

    // Remove mensagem de progresso
    const scanToast = document.getElementById('scan-toast');
    if(scanToast){ clearInterval(scanToast._interval); scanToast.remove(); }

    if(!allPacientes.length){ toast('Nenhum paciente identificado na(s) imagem(ns)','error'); return; }

    state.batchPreview = allPacientes;
    state.batchDate = today();
    pushNavLayer('modal:batchPreview');
    render();
    toast(allPacientes.length > 1
      ? `✓ ${allPacientes.length} pacientes encontrados — revise e confirme`
      : '✓ Etiqueta lida! Revise e confirme','success');

  } catch(e) {
    const scanToastErr = document.getElementById('scan-toast');
    if(scanToastErr){ clearInterval(scanToastErr._interval); scanToastErr.remove(); }
    console.error(e);
    const friendly = e && e.message && (e.message.includes('Limite de uso')||e.message.includes('Chave de acesso')||e.message.includes('muito grande')||e.message.includes('indisponível')||e.message.includes('Falha de conexão')||e.message.includes('Falha ao preparar'))
      ? e.message
      : friendlyAiError(0, e && e.message);
    toast(friendly,'error');
  }
}

async function handleRelatorio(input){
  const file = input.files[0];
  if(!file) return;
  
  const pends = state.patients.filter(p=>p.hospId===state.activeHosp&&p.status!=='PAGO'&&p.status!=='RETORNO');
  if(!pends.length){toast('Nenhum paciente pendente para conciliar','info');return;}

  const name = file.name.toLowerCase();
  
  // Excel/CSV: leitura local
  if(name.endsWith('.xlsx')||name.endsWith('.xls')||name.endsWith('.csv')){
    toast('Lendo planilha...','info');
    try {
      const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf,{type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const nn = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
      const encontrados = pends.filter(p=>rows.some(r=>Object.values(r).map(v=>String(v||'')).some(v=>v===p.atendimento||(nn(v)===nn(p.nome)&&v.length>3))));
      state.concilPreview = encontrados.map(p=>({...p,status:'PAGO',valorPago:p.valor}));
      render();
      if(encontrados.length) toast(`${encontrados.length} pacientes encontrados — confirme abaixo`,'success');
      else toast('Nenhum paciente encontrado na planilha','error');
    } catch(e) { toast('Erro ao ler planilha','error'); }
    return;
  }
  
  // PDF/Foto: envia para Audit AI
  toast('Enviando para Audit AI...','info');
  try {
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const csv = pends.map(p=>`${p.nome},${p.atendimento}`).join('\n');
    const response = await fetch(`${AI_URL}${AI_ROUTES.extract}`, {
      method: 'POST',
      headers: {'Accept':'application/json','Content-Type':'application/json','x-api-key':AI_KEY},
      body: JSON.stringify({
        fileBase64: base64,
        filename: file.name || 'relatorio.pdf',
        mimeType: file.type||'application/pdf',
        prompt: `Compare estes pacientes com o relatório hospitalar e diga quais foram PAGOS:\n${csv}\nRetorne JSON: {results:[{nome_paciente,numero_atendimento,status}]}`,
        schema:{type:'object',properties:{results:{type:'array',items:{type:'object',properties:{nome_paciente:{type:'string'},numero_atendimento:{type:'string'},status:{type:'string'}}}}}}
      })
    });
    if(!response.ok) throw new Error('Erro '+response.status);
    const data = await response.json();
    const results = (data.analysis||data.data||data).results||[];
    const encontrados = pends.filter(p=>results.find(r=>r.status==='PAGO'&&(r.numero_atendimento===p.atendimento||r.nome_paciente===p.nome)));
    state.concilPreview = encontrados.map(p=>({...p,status:'PAGO',valorPago:p.valor}));
    render();
    if(encontrados.length) toast(`${encontrados.length} pacientes encontrados — confirme abaixo`,'success');
    else toast('Nenhum paciente identificado no relatório','error');
  } catch(e) {
    toast('Erro ao processar relatório. Tente Excel ou CSV.','error');
    console.error(e);
  }
}

// ── CONFIG ────────────────────────────────────────────────────────────────────
function renderConfig(){
  // Auto-verifica conexão ao abrir ajustes
  setTimeout(()=>checkIAStatus(), 500);
  const allPats = state.patients;
  const hoje = new Date();
  const mesAtual = `${String(hoje.getMonth()+1).padStart(2,'0')}/${hoje.getFullYear()}`;

  // ── MÉDIA HISTÓRICA ACUMULADA POR CONVÊNIO ──────────────────────────────────
  // Para cada convênio: soma todos os valores pagos (histórico) ÷ total de pacientes pagos
  // Só considera pacientes PAGO (valores confirmados pelo hospital)
  const CONVENIOS_LIST = ['Unimed','Amil','Bradesco Saúde','SulAmérica','Porto Seguro',
    'Prevent Senior','NotreDame Intermédica','Hapvida','Particular','Outro'];

  const mediaConvenio = {};
  CONVENIOS_LIST.forEach(conv => {
    // Todos os pacientes pagos deste convênio em todos os meses/unidades
    const pagosConv = allPats.filter(a => a.convenio === conv && a.status === 'PAGO');
    if(pagosConv.length > 0){
      const totalRecebido = pagosConv.reduce((s,a) => s + (a.valorPago || a.valor || 0), 0);
      mediaConvenio[conv] = totalRecebido / pagosConv.length; // média histórica por paciente
    } else {
      mediaConvenio[conv] = null; // sem histórico ainda
    }
  });

  // Pacientes do mês atual
  const patsMes = allPats.filter(a => {
    if(!a.data) return false;
    const d = new Date(a.data);
    return `${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}` === mesAtual;
  });

  // Estimativa do mês = para cada paciente do mês, aplica a média histórica do convênio
  // Se não houver histórico do convênio, não inclui na estimativa
  let estimadoMes = 0;
  const semHistorico = [];
  patsMes.forEach(a => {
    const media = mediaConvenio[a.convenio];
    if(media != null) estimadoMes += media;
    else if(a.convenio && !semHistorico.includes(a.convenio)) semHistorico.push(a.convenio);
  });

  // Detalhamento por unidade
  const porUnidade = state.hospitals.map(h => {
    const pats = patsMes.filter(p=>p.hospId===h.id);
    let est = 0;
    pats.forEach(a => { if(mediaConvenio[a.convenio]!=null) est += mediaConvenio[a.convenio]; });
    return {name:h.name, pats:pats.length, est};
  }).filter(u=>u.pats>0);

  // Breakdown por convênio no mês atual (para exibir detalhes)
  const convMes = CONVENIOS_LIST.map(conv => {
    const pats = patsMes.filter(a=>a.convenio===conv);
    if(!pats.length) return null;
    const media = mediaConvenio[conv];
    const est = media!=null ? media*pats.length : null;
    const histPats = allPats.filter(a=>a.convenio===conv&&a.status==='PAGO').length;
    return {conv, pats:pats.length, media, est, histPats};
  }).filter(Boolean);

  return `
    <div class="glass anim-up" style="padding:24px;text-align:center;margin-bottom:20px;">
      <div style="width:80px;height:80px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,0.82),rgba(255,255,255,0.55));
        display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--lead);
        margin:0 auto 16px;box-shadow:var(--shadow2);">${state.profile.name?state.profile.name[0].toUpperCase():'DR'}</div>
      <div style="font-size:20px;font-weight:900;color:var(--text);">${state.profile.name}</div>
      <div style="font-size:12px;color:var(--green2);font-weight:800;margin-top:4px;text-transform:uppercase;letter-spacing:1px;">${state.profile.especialidade}</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px;">${state.profile.email}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;">
        <div style="background:rgba(255,255,255,0.52);border-radius:14px;padding:12px 14px;">
          <div class="lbl" style="margin-bottom:4px;">Pacientes em ${mesAtual}</div>
          <div style="font-size:22px;font-weight:900;color:var(--text);">${patsMes.length}</div>
        </div>
        <div style="background:rgba(46,200,102,0.10);border-radius:14px;padding:12px 14px;border:1px solid rgba(46,200,102,0.18);">
          <div class="lbl" style="margin-bottom:4px;">Estimado ${mesAtual}</div>
          <div style="font-size:16px;font-weight:900;color:var(--green2);">${fmtBRL(estimadoMes)}</div>
        </div>
      </div>
    </div>

    ${porUnidade.length>0?`
    <div class="lbl" style="margin-bottom:10px;">Estimativa por Unidade — ${mesAtual}</div>
    <div class="glass anim-up" style="padding:0;overflow:hidden;margin-bottom:20px;">
      ${porUnidade.map((u,i)=>`
      <div style="padding:14px 18px;${i<porUnidade.length-1?'border-bottom:1px solid rgba(0,0,0,0.05);':''}display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:800;font-size:14px;color:var(--text);">${u.name}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px;font-weight:600;">${u.pats} paciente${u.pats>1?'s':''} no mês</div>
        </div>
        <div style="font-weight:900;font-size:15px;color:var(--green2);">${fmtBRL(u.est)}</div>
      </div>`).join('')}
      <div style="padding:14px 18px;background:rgba(46,200,102,0.05);border-top:2px solid rgba(46,200,102,0.15);display:flex;justify-content:space-between;align-items:center;">
        <div style="font-weight:900;font-size:13px;color:var(--text2);">TOTAL ESTIMADO</div>
        <div style="font-weight:900;font-size:16px;color:var(--green2);">${fmtBRL(estimadoMes)}</div>
      </div>
    </div>`:''}

    ${convMes.length>0?`
    <div class="lbl" style="margin-bottom:10px;">Média Histórica por Convênio</div>

function saveProfile(){

  state.profile.crm  = crm;

async function downloadCSV(){
  // Carrega SheetJS dinamicamente
  const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs');
  
  const wb = XLSX.utils.book_new();
  const headers = ['Paciente','Nº Atendimento','Convênio','Data Atendimento','Status','Médico','CRM'];

  if(state.hospitals.length === 0){
    toast('Nenhum hospital cadastrado','error');
    return;
  }

  state.hospitals.forEach(hosp => {
    const pats = state.patients.filter(p => p.hospId === hosp.id);
    const rows = pats.map(p => ({
      'Paciente': p.nome || '',
      'Nº Atendimento': p.atendimento || '',
      'Convênio': p.convenio || '',
      'Data Atendimento': p.data ? new Date(p.data).toLocaleDateString('pt-BR') : '',
      'Status': p.status === 'PAGO' ? 'PAGO' : 'PENDENTE',
      'Médico': state.profile.name || '',
      'CRM': state.profile.crm || ''
    }));

    if(rows.length === 0){
      rows.push({'Paciente':'Sem pacientes cadastrados','Nº Atendimento':'','Convênio':'','Data Atendimento':'','Status':'','Médico':'','CRM':''});
    }

    const ws = XLSX.utils.json_to_sheet(rows, {header: headers});

    // Largura das colunas
    ws['!cols'] = [
      {wch:30}, // Paciente
      {wch:16}, // Atendimento
      {wch:20}, // Convênio
      {wch:16}, // Data
      {wch:12}, // Status
      {wch:25}, // Médico
      {wch:14}, // CRM
    ];

    // Nome da aba (max 31 chars, sem caracteres especiais)
    const sheetName = hosp.name.substring(0,31).replace(/[\/:*?\[\]]/g,'');
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  // Aba resumo geral
  const resumo = state.patients.map(p => {
    const h = state.hospitals.find(h=>h.id===p.hospId);
    return {
      'Hospital': h ? h.name : '',
      'Paciente': p.nome || '',
      'Nº Atendimento': p.atendimento || '',
      'Convênio': p.convenio || '',
      'Data Atendimento': p.data ? new Date(p.data).toLocaleDateString('pt-BR') : '',
      'Status': p.status === 'PAGO' ? 'PAGO' : 'PENDENTE',
    };
  });
  const wsResumo = XLSX.utils.json_to_sheet(resumo.length ? resumo : [{'Hospital':'Sem dados'}]);
  wsResumo['!cols'] = [{wch:25},{wch:30},{wch:16},{wch:20},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo Geral');

  XLSX.writeFile(wb, `MedReconcile_${today()}.xlsx`);
  toast('Excel exportado com sucesso!','success');
}
async function downloadInadimplencia(){
  const hospSel = document.getElementById('rel-hosp')?.value || 'TODOS';
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate()-30);

  // Filtra pacientes pendentes há mais de 30 dias
  let inad = state.patients.filter(p => {
    if(p.status==='PAGO') return false;
    if(!p.data) return false;
    if(new Date(p.data) > cutoff) return false;
    if(hospSel!=='TODOS' && p.hospId!==hospSel) return false;
    return true;
  });

  if(!inad.length){
    // Mostra mensagem amigável inline
    const btn = document.querySelector('[onclick="downloadInadimplencia()"]');
    const parent = btn?.closest('.glass');
    if(parent){
      const msg = document.createElement('div');
      msg.style.cssText = 'margin-top:12px;padding:14px 16px;border-radius:14px;background:rgba(46,200,102,0.08);border:1px solid rgba(46,200,102,0.20);display:flex;align-items:center;gap:12px;animation:fadeUp .3s ease both;';
      msg.innerHTML = `<span style="font-size:24px;">🎉</span><div><div style="font-weight:800;font-size:14px;color:var(--green2);">Tudo em dia!</div><div style="font-size:12px;color:var(--text3);margin-top:3px;">Nenhum paciente com mais de 30 dias sem pagamento neste hospital.</div></div>`;
      parent.appendChild(msg);
      setTimeout(()=>msg.remove(), 4000);
    }
    return;
  }

  // Monta CSV com todos os dados do paciente
  const rows = [[
    'Paciente',
    'Nº Atendimento',
    'Convênio',
    'Data de Inclusão',
    'Dias em Aberto',
    'Hospital',
    'Status',
    'Médico',
    'CRM'
  ]];

  inad.forEach(p => {
    const hosp = state.hospitals.find(h=>h.id===p.hospId);
    const dias = Math.floor((new Date()-new Date(p.data))/(1000*60*60*24));
    const dtBR = p.data ? new Date(p.data).toLocaleDateString('pt-BR') : '';
    rows.push([
      p.nome,
      p.atendimento,
      p.convenio||'Não informado',
      dtBR,
      `${dias} dias`,
      hosp?hosp.name:'Não informado',
      'PENDENTE',
      state.profile.name||'',
      state.profile.crm||''
    ]);
  });

  const hospNome = hospSel==='TODOS' ? 'Todos' : (state.hospitals.find(h=>h.id===hospSel)?.name||'Todos');
  
  // Usa SheetJS para gerar Excel real
  const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs');
  const wb = XLSX.utils.book_new();

  if(hospSel === 'TODOS'){
    // Uma aba por hospital
    state.hospitals.forEach(hosp => {
      const patsHosp = inad.filter(p=>p.hospId===hosp.id);
      if(!patsHosp.length) return;
      const rows = patsHosp.map(p => ({
        'Paciente': p.nome||'',
        'Nº Atendimento': p.atendimento||'',
        'Convênio': p.convenio||'',
        'Data Inclusão': p.data ? new Date(p.data).toLocaleDateString('pt-BR') : '',
        'Dias em Aberto': Math.floor((new Date()-new Date(p.data))/(1000*60*60*24))+' dias',
        'Status': 'PENDENTE',
        'Médico': state.profile.name||'',
        'CRM': state.profile.crm||''
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [{wch:30},{wch:16},{wch:20},{wch:16},{wch:14},{wch:12},{wch:25},{wch:14}];
      const sheetName = hosp.name.substring(0,31).replace(/[\/:*?\[\]]/g,'');
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });
  } else {
    const rows = inad.map(p => ({
      'Paciente': p.nome||'',
      'Nº Atendimento': p.atendimento||'',
      'Convênio': p.convenio||'',
      'Data Inclusão': p.data ? new Date(p.data).toLocaleDateString('pt-BR') : '',
      'Dias em Aberto': Math.floor((new Date()-new Date(p.data))/(1000*60*60*24))+' dias',
      'Status': 'PENDENTE',
      'Médico': state.profile.name||'',
      'CRM': state.profile.crm||''
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:30},{wch:16},{wch:20},{wch:16},{wch:14},{wch:12},{wch:25},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws, hospNome.substring(0,31));
  }

  XLSX.writeFile(wb, `Cobranca_${hospNome}_${today()}.xlsx`);
  toast(`Relatório exportado: ${inad.length} pacientes`,'success');
}

async function ensureDriveAccess(){
  if(window.getDriveToken && window.getDriveToken()) return true;
  try{
    toast('\u23f3 Solicitando permiss\u00e3o do Google Drive...','info');
    const result = await window.signInWithPopup(window.fbAuth, window.fbProvider);
    const credential = window.GoogleAuthProvider.credentialFromResult(result);
    if(credential && credential.accessToken){
      window.setDriveToken(credential.accessToken);
      toast('\u2713 Conectado ao Google Drive','success');
      return true;
    }
  }catch(e){
    console.error('Drive auth error:', e);
    toast('N\u00e3o foi poss\u00edvel abrir o login do Google. Toque em "Encerrar Sess\u00e3o" e entre de novo \u2014 isso vai conectar o Drive automaticamente.','error');
  }
  return false;
}

async function uploadBackupToDrive(token){
  const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs');

  const data = state.patients.map(a=>{
    const h = state.hospitals.find(x=>x.id===a.hospId);
    return {
      'Profissional': state.profile.name||'N/A',
      'CRM': state.profile.crm||'N/A',
      'Unidade': h?h.name:'N/A',
      'Paciente': a.nome,
      'Atendimento': a.atendimento,
      'Convênio': a.convenio||'',
      'Data': fmtDt(a.data),
      'Valor': a.valor||0,
      'Status': a.status||'PENDENTE'
    };
  });

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Backup');
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob = new Blob([buf], {type:mimeType});

  const name = `Backup_MedReconcile_${today()}.xlsx`;
  const metadata = {name, mimeType};

  // FormData nativo: o navegador monta o multipart/boundary automaticamente,
  // mais robusto do que montar o Blob multipart manualmente.
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
  form.append('file', blob);

  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method:'POST',
    headers:{'Authorization':`Bearer ${token}`},
    body: form
  });
  return res;
}

async function backupToDrive(){
  const btn = document.getElementById('drive-backup-btn');
  const txt = document.getElementById('drive-backup-text');

  if(!state.patients.length){ toast('Nenhum paciente para exportar','error'); return; }

  const ok = await ensureDriveAccess();
  if(!ok) return;

  let token = window.getDriveToken();
  if(!token){ toast('Não foi possível obter acesso ao Drive','error'); return; }

  try{
    if(btn) btn.disabled = true;
    if(txt) txt.textContent = '⏳ Preparando backup...';
    toast('⏳ Preparando backup...','info');

    if(txt) txt.textContent = '⏳ Enviando para o Drive...';
    let res = await uploadBackupToDrive(token);

    // Token pode ter expirado (sessão antiga salva no celular): limpa e tenta de novo com novo login
    if(!res.ok && (res.status===401 || res.status===403)){
      window.setDriveToken(null);
      toast('Sessão do Drive expirada, reconectando...','info');
      const reconnected = await ensureDriveAccess();
      if(!reconnected) throw new Error('Não foi possível reconectar ao Drive');
      token = window.getDriveToken();
      if(!token) throw new Error('Token não disponível após reconexão');
      res = await uploadBackupToDrive(token);
    }

    if(!res.ok){
      throw new Error('O Google Drive recusou o envio (código '+res.status+'). Tente novamente em alguns instantes.');
    }

    toast('✓ Backup salvo no Google Drive!','success');
  }catch(e){
    console.error(e);
    const msg = (e && e.message && e.message.toLowerCase().includes('fetch'))
      ? 'Falha de conexão ao enviar para o Drive. Verifique sua internet e tente novamente.'

async function loginEmail(action){
  const email = document.getElementById('login-email')?.value.trim();
  const pass  = document.getElementById('login-pass')?.value;
  const errDiv = document.getElementById('login-error');

  if(action==='reset'){
    if(!email){ if(errDiv){errDiv.style.display='block';errDiv.textContent='Digite seu e-mail primeiro.';} return; }
    try{
      const {sendPasswordResetEmail} = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
      await sendPasswordResetEmail(window.fbAuth, email);
      if(errDiv){errDiv.style.display='block';errDiv.style.color='var(--green2)';errDiv.textContent='Link enviado! Verifique seu e-mail.';}
    }catch(e){ if(errDiv){errDiv.style.display='block';errDiv.style.color='var(--red)';errDiv.textContent=e.message;} }
    return;
  }

  if(!email||!pass){ if(errDiv){errDiv.style.display='block';errDiv.textContent='Preencha e-mail e senha.';} return; }

  try{
    const {signInWithEmailAndPassword, createUserWithEmailAndPassword} = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    let result;
    if(action==='register'){
      result = await createUserWithEmailAndPassword(window.fbAuth, email, pass);
    } else {
      result = await signInWithEmailAndPassword(window.fbAuth, email, pass);
    }
    window.currentUser = result.user;
    await loadUserData(result.user.uid);
    document.getElementById('login-screen').style.display='none';
    showPinOrApp();
  }catch(e){
    if(errDiv){
      errDiv.style.display='block';
      errDiv.style.color='var(--red)';
      if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') errDiv.textContent='Senha incorreta.';
      else if(e.code==='auth/user-not-found') errDiv.textContent='E-mail não cadastrado.';
      else if(e.code==='auth/email-already-in-use') errDiv.textContent='E-mail já cadastrado. Faça login.';
      else if(e.code==='auth/weak-password') errDiv.textContent='Senha fraca — mínimo 6 caracteres.';
      else errDiv.textContent = e.message;
    }
  }
}

async function loginGoogle(){
  try{
    if(!window.fbSignIn){ toast('Firebase carregando...','info'); return; }
    const result = await window.fbSignIn();
    window.currentUser = result.user;
    // O provider já solicita o escopo do Drive junto com o login principal —
    // aproveitamos o mesmo token aqui, sem precisar de uma segunda autenticação.
    try{
      const credential = window.GoogleAuthProvider.credentialFromResult(result);
      if(credential && credential.accessToken){
        window.setDriveToken(credential.accessToken);
      }
    }catch(_){}
    await loadUserData(result.user.uid);
    document.getElementById('login-screen').style.display='none';
    showPinOrApp();
  }catch(e){
    const errDiv = document.getElementById('login-error');
    if(errDiv){ errDiv.style.display='block'; errDiv.textContent = 'Erro ao entrar. Tente novamente.'; }
    console.error(e);
  }
}

      <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:340px;">
        <div style="width:88px;height:88px;border-radius:28px;background:linear-gradient(135deg,rgba(46,200,102,0.12),rgba(46,200,102,0.05));display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 24px;border:1px solid rgba(46,200,102,0.18);">✉️</div>
        <div style="font-size:22px;font-weight:900;color:var(--text);margin-bottom:10px;">Link Enviado!</div>
        <div style="font-size:13px;color:var(--text3);font-weight:600;line-height:1.7;margin-bottom:6px;">Verifique sua caixa de entrada em</div>
        <div style="font-size:14px;font-weight:800;color:var(--green2);margin-bottom:28px;">${email}</div>
        <div class="glass" style="padding:20px 24px;margin-bottom:20px;text-align:left;">
          ${['Abra o e-mail com o link de redefinição','Clique no link e crie um novo PIN de acesso','Volte ao app e entre com seu novo PIN'].map((t,i)=>`
          <div style="display:flex;align-items:flex-start;gap:12px;${i<2?'margin-bottom:14px;':''}">
            <span style="font-size:16px;flex-shrink:0;">${['1️⃣','2️⃣','3️⃣'][i]}</span>
            <div style="font-size:13px;color:var(--text2);font-weight:600;line-height:1.5;">${t}</div>
          </div>`).join('')}
        </div>
        <button onclick="pinInput='';renderPin()" class="btn-p" style="width:100%;padding:14px;">← Voltar ao PIN</button>
      </div>
    </div>`;
}

function pinTap(k){
  if(k==='⌫'){pinInput=pinInput.slice(0,-1);renderPin();return;}
  pinInput+=k;
  renderPin();
  if(pinInput.length===6){
    if(pinInput===CORRECT_PIN){
      setTimeout(()=>{
        document.getElementById('pin-screen').style.display='none';
        document.getElementById('app').style.display='block';
        state.activeTab='inicio';
        navStack = ['tab:inicio'];
        try{ history.replaceState({navAnchor:true,base:true}, '', location.href); }catch(_){}
        showTab('inicio');
        // Update topbar with user name
        if(window.currentUser && state.profile.name){
          const el = document.getElementById('topbar-subtitle');
          if(el) el.textContent = state.profile.name;
        }
      },200);
    } else {
      setTimeout(()=>{pinInput='';renderPin('PIN incorreto. Tente novamente.');},400);
    }
  }
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    const splash=document.getElementById('splash');
    splash.classList.add('exit');
    setTimeout(()=>{
      splash.style.display='none';
      // Check Firebase auth state
      if(window.fbOnAuth){
        window.fbOnAuth(async (user)=>{
          if(user){
            window.currentUser = user;
            state.profile.email = user.email;
            await loadUserData(user.uid);
            showPinOrApp();
          } else {
            document.getElementById('login-screen').style.display='block';
            renderLoginScreen('main');
          }
        });
      } else {
        setTimeout(()=>{
          if(window.fbOnAuth){
            window.fbOnAuth(async (user)=>{
              if(user){
                window.currentUser = user;
                await loadUserData(user.uid);
                showPinOrApp();
              } else {
                document.getElementById('login-screen').style.display='block';
                renderLoginScreen('main');
              }
            });
          } else {
            document.getElementById('login-screen').style.display='block';
            renderLoginScreen('main');
          }
        }, 1500);
      }
    },550);
  },3200);
});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(r=>console.log('SW ok')).catch(e=>console.log('SW erro',e));
  });
}
</script>
