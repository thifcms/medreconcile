<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCogtfOJ-_qlXCGGEqvZ9sRFlfWm_20yao",
    authDomain: "spherical-leaf-vr5vm.firebaseapp.com",
    projectId: "spherical-leaf-vr5vm",
    storageBucket: "spherical-leaf-vr5vm.firebasestorage.app",
    messagingSenderId: "572028997371",
    appId: "1:572028997371:web:86d2fc27b2f6d4e529ea5e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app, "ai-studio-07b01720-0a41-4e0a-89f7-93e327ec5916");
  const provider = new GoogleAuthProvider();
  provider.addScope('https://www.googleapis.com/auth/drive.file');

  let _driveToken = localStorage.getItem('med_drive_token');
  window.setDriveToken = (t) => { _driveToken = t; t ? localStorage.setItem('med_drive_token', t) : localStorage.removeItem('med_drive_token'); };
  window.getDriveToken = () => _driveToken;
  window.GoogleAuthProvider = GoogleAuthProvider;
  window.signInWithPopup = signInWithPopup;
  window.signInWithRedirect = signInWithRedirect;
  window.getRedirectResult = getRedirectResult;
  window.isStandalonePWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  window.fbAuth = auth;
  window.fbDb = db;
  window.fbProvider = provider;
  window.fbSignIn = () => signInWithPopup(auth, provider);
  window.fbSignOut = () => signOut(auth);
  window.fbOnAuth = (cb) => onAuthStateChanged(auth, cb);
  window.fbSaveData = async (userId, data) => {
    await setDoc(doc(db, "users", userId, "data", "medreconcile"), data);
  };
  window.fbLoadData = async (userId) => {
    const snap = await getDoc(doc(db, "users", userId, "data", "medreconcile"));
    return snap.exists() ? snap.data() : null;
  };

  console.log("Firebase inicializado!");
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>MedReconcile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#e8ecee;
  --glass:rgba(255,255,255,0.68);
  --border:rgba(255,255,255,0.75);
  --text:#1a1c1e;
  --text2:#3b3e42;
  --text3:#8a9099;
  --lead:#4b5259;
  --lead2:#272d32;
  --lead3:#1e2528;
  --green:#2ec866;
  --green2:#1fa050;
  --greenglow:#39e874;
  --red:#d94040;
  --orange:#d97a00;
  --shadow:0 4px 24px rgba(0,0,0,0.08);
  --shadow2:0 8px 40px rgba(0,0,0,0.14);
  --blur:blur(24px) saturate(180%);
  --radius:18px;
}
body{font-family:'Nunito',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
input,select,button{font-family:inherit;}
button{cursor:pointer;}

/* ── MESH BACKGROUND ── */
.mesh-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 8% 12%,rgba(46,200,102,0.055) 0%,transparent 65%),
    radial-gradient(ellipse 50% 55% at 92% 18%,rgba(46,200,102,0.028) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 78% 88%,rgba(75,82,89,0.04) 0%,transparent 60%),
    radial-gradient(ellipse 40% 45% at 28% 78%,rgba(46,200,102,0.032) 0%,transparent 55%),
    linear-gradient(160deg,#eaedeb 0%,#eceef0 50%,#e9ecee 100%);}
.mesh-bg::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle 280px at 72% 28%,rgba(46,200,102,0.035) 0%,transparent 70%),
    radial-gradient(circle 200px at 18% 62%,rgba(46,200,102,0.025) 0%,transparent 70%);}

/* ── GLASS ── */
.glass{
  background:linear-gradient(145deg,rgba(255,255,255,0.72) 0%,rgba(255,255,255,0.58) 100%);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,0.75);border-radius:22px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,0.85);}

/* ── BUTTONS ── */
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:16px;border:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#35d46e 0%,#22a852 60%,#1a8f45 100%);
  box-shadow:0 6px 22px rgba(46,200,102,0.42),inset 0 1px 0 rgba(255,255,255,0.28);
  position:relative;overflow:hidden;transition:all 0.2s;}
.btn-p::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.32),transparent);
  transform:skewX(-20deg);transition:left 0.5s ease;}
.btn-p:hover::before{left:130%;}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(46,200,102,0.52);}
.btn-p:active{transform:scale(0.97);}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-g{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;border-radius:14px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;color:var(--lead);
  background:linear-gradient(135deg,rgba(255,255,255,0.58),rgba(255,255,255,0.38));
  border:1px solid rgba(255,255,255,0.70);
  box-shadow:0 2px 8px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.75);
  transition:all 0.18s;}
.btn-g:hover{background:rgba(255,255,255,0.82);transform:translateY(-1px);}
.btn-g:active{transform:scale(0.97);}
.btn-d{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 12px;border-radius:11px;cursor:pointer;font-family:inherit;
  font-size:12px;font-weight:700;color:var(--red);
  background:rgba(217,64,64,0.07);border:1px solid rgba(217,64,64,0.14);transition:all 0.18s;}
.btn-d:hover{background:rgba(217,64,64,0.13);}

/* ── INPUT ── */
.input{width:100%;padding:13px 15px;border-radius:13px;
  border:1.5px solid rgba(255,255,255,0.68);
  background:linear-gradient(145deg,rgba(255,255,255,0.82),rgba(255,255,255,0.65));
  box-shadow:inset 0 1px 4px rgba(0,0,0,0.05),0 1px 0 rgba(255,255,255,0.82);
  font-family:inherit;font-size:15px;color:var(--text);outline:none;transition:all 0.18s;}
.input:focus{border-color:rgba(46,200,102,0.55);background:rgba(255,255,255,0.94);
  box-shadow:0 0 0 4px rgba(46,200,102,0.12),inset 0 1px 4px rgba(0,0,0,0.04);}
.input::placeholder{color:var(--text3);}
select.input{cursor:pointer;appearance:none;}

/* ── LABELS & BADGES ── */
.lbl{font-size:11px;font-weight:800;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.badge-g{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;background:rgba(46,200,102,0.12);color:#1a7a3c;border:1px solid rgba(46,200,102,0.18);}
.badge-l{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;background:rgba(75,82,89,0.10);color:var(--lead);}
.badge-o{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700;background:rgba(217,122,0,0.10);color:var(--orange);}

/* ── NAV ── */
.nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:2px;padding:6px;
  background:linear-gradient(160deg,#323a40 0%,#222930 60%,var(--lead3) 100%);
  border-radius:24px;border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 10px 40px rgba(0,0,0,0.30),inset 0 1px 0 rgba(255,255,255,0.06);
  z-index:50;width:calc(100% - 40px);max-width:420px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 4px;border-radius:16px;border:none;cursor:pointer;
  background:transparent;color:rgba(255,255,255,0.35);
  font-size:9px;font-weight:800;font-family:inherit;
  transition:all 0.22s cubic-bezier(0.34,1.4,0.64,1);}
.nav-btn svg{width:20px;height:20px;}
.nav-btn.active{background:linear-gradient(135deg,#35d46e,#22a852,#1a8f45);
  color:#fff;box-shadow:0 4px 16px rgba(46,200,102,0.52),inset 0 1px 0 rgba(255,255,255,0.22);}
.nav-btn:hover:not(.active){color:rgba(255,255,255,0.72);}

/* ── TOASTS ── */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{padding:13px 18px;border-radius:14px;font-size:14px;font-weight:700;max-width:300px;
  background:linear-gradient(145deg,rgba(255,255,255,0.94),rgba(255,255,255,0.82));
  backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,0.80);
  box-shadow:0 8px 32px rgba(0,0,0,0.12);display:flex;align-items:center;gap:10px;
  animation:fadeUp 0.28s ease both;}
.toast-success{border-left:4px solid var(--green);}
.toast-error{border-left:4px solid var(--red);}
.toast-info{border-left:4px solid var(--lead);}

/* ── PIN ── */
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
.pin-key{aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,0.90),rgba(255,255,255,0.68));
  color:var(--text);font-size:20px;font-weight:700;font-family:inherit;
  box-shadow:0 3px 12px rgba(0,0,0,0.09),inset 0 1px 0 rgba(255,255,255,0.92);
  transition:all 0.14s cubic-bezier(0.34,1.56,0.64,1);}
.pin-key:active{transform:scale(0.88);background:linear-gradient(135deg,#35d46e,#22a852);color:#fff;box-shadow:0 4px 18px rgba(46,200,102,0.42);}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(46,200,102,0.40);transition:all 0.18s;}
.pin-dot.filled{background:var(--green);border-color:var(--green);transform:scale(1.15);box-shadow:0 0 8px rgba(46,200,102,0.50);}

/* ── SPLASH 3D ── */
.splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#e6ebe8 0%,#eceef0 50%,#e8ecee 100%);overflow:hidden;}
.splash-bg{position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 20% 20%,rgba(46,200,102,0.08) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%,rgba(75,82,89,0.06) 0%,transparent 55%);
  animation:splashBgPulse 3s ease-in-out infinite alternate;}
@keyframes splashBgPulse{from{opacity:.6;}to{opacity:1;}}
.splash-scene{perspective:800px;perspective-origin:50% 50%;margin-bottom:36px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}
.splash-logo-3d{width:108px;height:108px;transform-style:preserve-3d;
  animation:logo3dEnter 1.6s cubic-bezier(0.34,1.2,0.64,1) both, logo3dFloat 4s ease-in-out 1.6s infinite alternate;}
@keyframes logo3dEnter{
  0%{transform:rotateX(-90deg) rotateY(30deg) scale(0.3);opacity:0;}
  40%{transform:rotateX(12deg) rotateY(-8deg) scale(1.05);opacity:1;}
  65%{transform:rotateX(-6deg) rotateY(4deg) scale(0.98);}
  80%{transform:rotateX(3deg) rotateY(-2deg) scale(1.01);}
  100%{transform:rotateX(0deg) rotateY(0deg) scale(1);opacity:1;}}
@keyframes logo3dFloat{
  from{transform:rotateX(0deg) rotateY(-4deg) translateY(0px);}
  to{transform:rotateX(4deg) rotateY(4deg) translateY(-7px);}}
.splash-logo-face{width:108px;height:108px;border-radius:32px;
  background:linear-gradient(145deg,#f0f2f0 0%,#e2e6e3 100%);
  box-shadow:0 22px 64px rgba(0,0,0,0.14),0 6px 20px rgba(0,0,0,0.08),inset 0 2px 0 rgba(255,255,255,0.92),inset 0 -2px 0 rgba(0,0,0,0.06);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.splash-logo-face::before{content:'';position:absolute;top:-30%;left:-30%;width:60%;height:60%;
  background:radial-gradient(ellipse,rgba(255,255,255,0.82) 0%,transparent 70%);border-radius:50%;
  animation:sheenMove 4s ease-in-out 1.6s infinite alternate;}
@keyframes sheenMove{from{transform:translate(0,0);}to{transform:translate(22px,16px);}}
.splash-logo-shadow{width:88px;height:18px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,0.12) 0%,transparent 70%);margin-top:10px;
  animation:shadowPulse 4s ease-in-out 1.6s infinite alternate;}
@keyframes shadowPulse{from{transform:scaleX(1);opacity:.7;}to{transform:scaleX(.84);opacity:.38;}}
.splash-title{font-size:30px;font-weight:900;letter-spacing:-0.8px;color:var(--text);z-index:1;white-space:nowrap;}
.splash-letter{display:inline-block;opacity:0;transform:translateY(18px) rotateX(-60deg);filter:blur(3px);
  animation:letterReveal 0.5s cubic-bezier(0.34,1.4,0.64,1) both;}
@keyframes letterReveal{to{opacity:1;transform:translateY(0) rotateX(0deg);filter:blur(0);}}
.splash-sub{font-size:13px;color:var(--text3);font-weight:600;margin-top:7px;letter-spacing:0.3px;
  opacity:0;transform:translateY(10px);animation:textReveal 0.5s cubic-bezier(0.34,1.4,0.64,1) 1.75s both;z-index:1;}
@keyframes textReveal{to{opacity:1;transform:translateY(0);}}
.splash-glow-ring{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
  border-radius:50%;border:1.5px solid transparent;
  background:conic-gradient(from 0deg,transparent 0%,rgba(46,200,102,0.55) 12%,transparent 28%,transparent 100%) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;animation:ringFadeIn 0.6s ease 0.5s both,ringSpin 3.6s linear 1.1s infinite;z-index:0;}
.splash-glow-ring-2{width:186px;height:186px;margin:-93px 0 0 -93px;
  background:conic-gradient(from 180deg,transparent 0%,rgba(75,82,89,0.3) 10%,transparent 24%,transparent 100%) border-box;
  animation:ringFadeIn 0.6s ease 0.65s both,ringSpin 5.2s linear reverse 1.1s infinite;}
@keyframes ringFadeIn{to{opacity:1;}}
@keyframes ringSpin{to{transform:rotate(360deg);}}
.splash-logo-sparks{position:absolute;inset:0;pointer-events:none;opacity:0;animation:ringFadeIn 0.5s ease 1.6s both;}
.splash-logo-sparks span{position:absolute;width:4px;height:4px;border-radius:50%;
  background:var(--greenglow,#4fe08a);box-shadow:0 0 8px 2px rgba(46,200,102,0.7);
  animation:sparkFloat 2.4s ease-in-out infinite;}
.splash-logo-sparks span:nth-child(1){top:6%;left:14%;animation-delay:0s;}
.splash-logo-sparks span:nth-child(2){top:12%;right:8%;animation-delay:.5s;}
.splash-logo-sparks span:nth-child(3){bottom:10%;left:6%;animation-delay:1s;}
.splash-logo-sparks span:nth-child(4){bottom:4%;right:14%;animation-delay:1.5s;}
@keyframes sparkFloat{0%,100%{opacity:0;transform:translateY(0) scale(0.6);}50%{opacity:1;transform:translateY(-8px) scale(1);}}
.splash-dots{display:flex;gap:6px;margin-top:40px;opacity:0;animation:textReveal 0.4s ease 2.3s both;z-index:1;}
.splash-dot{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:.3;animation:dotPulse 1.2s ease-in-out infinite;}
.splash-dot:nth-child(2){animation-delay:.2s;}.splash-dot:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{0%,100%{opacity:.25;transform:scale(.85);}50%{opacity:1;transform:scale(1.2);background:var(--greenglow);}}
.splash.exit{animation:splashExit .55s cubic-bezier(.4,0,1,1) both;}
@keyframes splashExit{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.06);pointer-events:none;}}

/* ── SWIPE ── */
#content{touch-action:pan-y;user-select:none;}
.swipe-anim-left{animation:swipeLeft 0.22s cubic-bezier(0.4,0,0.2,1) both;}
.swipe-anim-right{animation:swipeRight 0.22s cubic-bezier(0.4,0,0.2,1) both;}
@keyframes swipeLeft{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
@keyframes swipeRight{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}
.tab-fade-out{animation:tabFadeOut 0.13s ease both;}
@keyframes tabFadeOut{from{opacity:1;transform:translateY(0) scale(1);}to{opacity:0;transform:translateY(-4px) scale(0.99);}}
.tab-fade-in{animation:tabFadeIn 0.22s cubic-bezier(0.34,1.1,0.64,1) both;}
@keyframes tabFadeIn{from{opacity:0;transform:translateY(6px) scale(0.99);}to{opacity:1;transform:translateY(0) scale(1);}}

/* ── TOPBAR ── */
.topbar{padding:18px 20px 14px;position:sticky;top:0;z-index:40;
  background:linear-gradient(145deg,rgba(255,255,255,0.72),rgba(255,255,255,0.55));
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid rgba(255,255,255,0.75);
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 20px rgba(0,0,0,0.06);}
.topbar-logo{width:42px;height:42px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(145deg,#f0f2f0,#e4e8e5);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.10),inset 0 1px 0 rgba(255,255,255,0.90);}
.topbar-avatar{width:42px;height:42px;border-radius:21px;flex-shrink:0;
  background:linear-gradient(135deg,#35d46e,#1a8f45);
  border:2px solid rgba(255,255,255,0.85);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:16px;cursor:pointer;
  box-shadow:0 6px 18px rgba(46,200,102,0.42),inset 0 1px 0 rgba(255,255,255,0.28);}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shimLoad{0%{transform:translateX(-200%);}100%{transform:translateX(400%);}}
.anim-up{animation:fadeUp 0.32s cubic-bezier(0.34,1.4,0.64,1) both;}
.spin{animation:spin 0.8s linear infinite;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.10);border-radius:4px;}

/* ── HERO CONCIL ── */
.hero-concil{background:linear-gradient(135deg,#2ec866,#1a8f45);border-radius:26px;padding:26px;
  box-shadow:0 18px 44px rgba(46,200,102,0.32);position:relative;overflow:hidden;margin-bottom:16px;}
.hero-concil::after{content:'📊';position:absolute;top:-20px;right:-16px;font-size:110px;opacity:.08;pointer-events:none;}

/* ── RELATÓRIO BARS ── */
.rel-bar{height:5px;background:rgba(0,0,0,0.07);border-radius:3px;overflow:hidden;margin-top:8px;}
.rel-bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .6s ease;}

/* ── ALERTA BADGE ── */
.alert-30{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:800;background:rgba(217,122,0,0.10);color:var(--orange);
  border:1px solid rgba(217,122,0,0.18);margin-top:4px;}
.alert-60{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:800;background:rgba(217,64,64,0.10);color:var(--red);
  border:1px solid rgba(217,64,64,0.18);margin-top:4px;}

/* ── OFFLINE BANNER ── */
.offline-banner{background:rgba(217,64,64,0.09);border:1px solid rgba(217,64,64,0.20);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
</style>
</head>
<body>
<div class="mesh-bg"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────────
// ── AUDIT AI CONFIG ──────────────────────────────────────────────────────────
const AI_URL = "https://audit-ai-6wed.onrender.com";
const AI_KEY = "auditai_key_2026_medico";

// Rotas descobertas automaticamente
const AI_ROUTES = {
  health: '/api/health',
  extract: '/api/gemini/extract',
  publicExtract: '/public/extract',
  keepalive: '/api/keepalive'
};

// Service Discovery — aprende os caminhos do Audit AI automaticamente (sem chave)
async function discoverAIRoutes(){
  try {
    const res = await fetch(`${AI_URL}/api/routes`); // endpoint público
    if(res.ok){
      const data = await res.json();
      if(data.routes) Object.assign(AI_ROUTES, data.routes);
      if(data.endpoints) Object.assign(AI_ROUTES, data.endpoints);
      console.log('[MedReconcile] Rotas descobertas automaticamente:', AI_ROUTES);
      // Salva no estado para exibir no diagnóstico
      window._aiRoutes = data;
    }
  } catch(e) {
    console.log('[MedReconcile] Usando rotas padrão:', AI_ROUTES);
  }
}

// Executa discovery ao carregar
discoverAIRoutes();

// Busca candidatos de formato de relatório pendentes de revisão (não depende de login)
async function fetchPendingFormatCandidates(){
  try{
    const res = await fetch(`${AI_URL}/api/learning/format-candidates/pending`, {
      headers:{'x-api-key':AI_KEY}
    });
    if(res.ok){
      const resData = await res.json();
      if(resData.success){
        state.pendingCandidates = resData.candidates || [];
        if(state.activeTab==='inicio') render();
      }
    }
  }catch(err){
    console.error('[MedReconcile] Erro ao buscar candidatos pendentes:', err);
  }
}
fetchPendingFormatCandidates();

async function handleReviewCandidate(approved){
  const candidate = state.reviewingCandidate;
  if(!candidate) return;
  try{
    const reviewedBy = (state.profile?.name||'').replace(/^(dr\.?|dra\.?)\s+/i,'').trim() || 'Médico MedReconcile';
    const amostraFinal = candidate._amostraAtual || candidate.resultadosSample || [];
    const res = await fetch(`${AI_URL}/api/learning/format-candidates/${candidate.id}/review`, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':AI_KEY},
      body: JSON.stringify({approved, reviewedBy, correctedSample: amostraFinal})
    });
    if(!res.ok){
      toast('Erro ao registrar a revisão. Tente novamente.','error');
      return;
    }
    toast('Obrigado pela revisão!','success');
    state.pendingCandidates = state.pendingCandidates.filter(c=>c.id!==candidate.id);
    state.reviewingCandidate = null;
    render();
  }catch(err){
    console.error('[MedReconcile] Erro ao enviar revisão:', err);
    toast('Falha de conexão ao enviar a revisão.','error');
  }
}
function openReviewCandidate(candidate){ state.reviewingCandidate = candidate; render(); }
function closeReviewCandidate(){ state.reviewingCandidate = null; render(); }

const fmtBRL = v => v == null ? '—' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtDt  = d => {
  if(!d) return '—';
  // Evita bug de fuso horario: parseia YYYY-MM-DD manualmente
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  return new Date(d).toLocaleDateString('pt-BR');
};

// ── PICKER DE MÊS/ANO (estilo roleta) ───────────────────────────────────────
const NOMES_MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function openMesPicker(target){
  const all = state.patients.filter(p=>p.hospId===state.activeHosp);
  const base = target==='pagos' ? all.filter(a=>a.status==='PAGO') : all;
  const anosDisponiveis = Array.from(new Set(base.filter(a=>a.data).map(a=>new Date(a.data).getFullYear()))).sort();
  const atual = target==='pagos' ? state.pagosFiltro : state.mesFiltro;
  let mesIni = null, anoIni = anosDisponiveis.length ? anosDisponiveis[anosDisponiveis.length-1] : new Date().getFullYear();
  if(atual && atual!=='TODOS'){
    const [mm,yy] = atual.split('/');
    mesIni = parseInt(mm,10)-1; anoIni = parseInt(yy,10);
  }
  state.mesPickerTarget = target;
  state.mesPickerTempMes = mesIni;
  state.mesPickerTempAno = anoIni;
  state.showMesPicker = true;
  pushNavLayer('modal:mesPicker');
  render();
}
let ignoreNextPopstate = false;
function popNavLayer(){
  // Fechamento manual (via botão, não via gesto voltar): sincroniza a pilha e o histórico,
  // mas ignora o popstate que isso vai disparar (já fechamos o modal manualmente).
  if(navStack.length>1){
    navStack.pop();
    ignoreNextPopstate = true;
    try{ history.back(); }catch(_){ ignoreNextPopstate=false; }
  }
}
function closeMesPicker(){ 
  state.showMesPicker=false; 
  const ov=document.getElementById('mes-picker-overlay');
  if(ov) ov.remove();
  popNavLayer(); 
  render(); 
}
function confirmMesPicker(){
  const valor = state.mesPickerTempMes===null ? 'TODOS' : `${String(state.mesPickerTempMes+1).padStart(2,'0')}/${state.mesPickerTempAno}`;
  if(state.mesPickerTarget==='pagos') state.pagosFiltro = valor;
  else state.mesFiltro = valor;
  state.showMesPicker = false;
  popNavLayer();
  render();
}
function mesPickerSetTodos(){ state.mesPickerTempMes=null; render(); }
function mesPickerSetMes(i){ state.mesPickerTempMes=i; render(); }
function mesPickerSetAno(a){ state.mesPickerTempAno=a; render(); }

function renderMesPickerModal(){
  // Remove modal anterior se existir
  const existing = document.getElementById('mes-picker-overlay');
  if(existing) existing.remove();
  if(!state.showMesPicker) return '';
  const all = state.patients.filter(p=>p.hospId===state.activeHosp);
  const base = state.mesPickerTarget==='pagos' ? all.filter(a=>a.status==='PAGO') : all;
  const anosDisponiveis = Array.from(new Set(base.filter(a=>a.data).map(a=>{
    const parts=a.data.split('-');
    return parts.length===3?parseInt(parts[0]):new Date(a.data).getFullYear();
  }))).sort();
  const anos = anosDisponiveis.length ? anosDisponiveis : [new Date().getFullYear()];
  const mesSel = state.mesPickerTempMes;
  const anoSel = state.mesPickerTempAno;
  const overlay = document.createElement('div');
  overlay.id = 'mes-picker-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,30,25,0.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeMesPicker(); };
  overlay.innerHTML = `
    <div class="glass anim-up" style="width:100%;max-width:340px;padding:20px;border-radius:24px;">
      <div style="font-size:14px;font-weight:900;color:var(--text);margin-bottom:14px;text-align:center;">Filtrar por período</div>
      <button onclick="mesPickerSetTodos()" style="width:100%;padding:10px;border-radius:12px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.70);
        background:${mesSel===null?'linear-gradient(135deg,#35d46e,#1a8f45)':'rgba(255,255,255,0.55)'};
        color:${mesSel===null?'#fff':'var(--lead)'};font-weight:800;font-size:13px;font-family:inherit;cursor:pointer;">Todos os períodos</button>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;max-height:220px;overflow-y:auto;border-radius:14px;background:rgba(255,255,255,0.45);padding:6px;">
          ${NOMES_MESES.map((nm,i)=>`
            <div onclick="mesPickerSetMes(${i})" style="padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:${mesSel===i?'900':'600'};
              background:${mesSel===i?'linear-gradient(135deg,#35d46e,#1a8f45)':'transparent'};
              color:${mesSel===i?'#fff':'var(--text2)'};margin-bottom:2px;text-align:center;">${nm}</div>`).join('')}
        </div>
        <div style="flex:1;max-height:220px;overflow-y:auto;border-radius:14px;background:rgba(255,255,255,0.45);padding:6px;">
          ${anos.map(a=>`
            <div onclick="mesPickerSetAno(${a})" style="padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:${anoSel===a?'900':'600'};
              background:${anoSel===a?'linear-gradient(135deg,#35d46e,#1a8f45)':'transparent'};
              color:${anoSel===a?'#fff':'var(--text2)'};margin-bottom:2px;text-align:center;">${a}</div>`).join('')}
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn-g" style="flex:1;" onclick="closeMesPicker()">Cancelar</button>
        <button class="btn-p" style="flex:1;" onclick="confirmMesPicker()">Aplicar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  return '';
}

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const ic = type==='success'?'✓':type==='error'?'✕':'ℹ';
  el.innerHTML = `<span>${ic}</span>${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

// Overlay persistente de processamento — diferente do toast, NÃO some sozinho.
// Fica visível enquanto uma operação demorada (ex: análise de PDF pela IA) está
// em andamento, deixando claro pro usuário que o app está trabalhando, não travado.
function showProcessingOverlay(msg){
  hideProcessingOverlay();
  const el = document.createElement('div');
  el.id = 'processing-overlay';
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:700;display:flex;align-items:center;justify-content:center;padding:20px;';
  el.innerHTML = `
    <div style="background:#fff;border-radius:20px;padding:28px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.3);">
      <div style="width:40px;height:40px;margin:0 auto 16px;border:3px solid rgba(46,200,102,0.2);border-top-color:var(--green2);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="font-size:14px;font-weight:800;color:var(--text);margin-bottom:4px;">${msg}</div>
      <div style="font-size:11px;color:var(--text3);font-weight:600;">Isso pode levar até 1 minuto para relatórios grandes.</div>
    </div>`;
  document.body.appendChild(el);
  if(!document.getElementById('spin-keyframes')){
    const style = document.createElement('style');
    style.id = 'spin-keyframes';
    style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
    document.head.appendChild(style);
  }
}
function hideProcessingOverlay(){
  const el = document.getElementById('processing-overlay');
  if(el) el.remove();
}

const TITLES = {inicio:'MedReconcile',unidades:'Unidades Médicas',atendimentos:'Pacientes',auditagem:'Conciliação',config:'Perfil & Ajustes'};
const TAB_ORDER = ['inicio','unidades','atendimentos','auditagem','config'];

// ── HISTÓRICO DO NAVEGADOR (botão voltar do Android) ────────────────────────
// Pilha de "camadas" abertas: modais/telas extras ficam no topo, abas ficam embaixo.
// Ao pressionar voltar: fecha a camada do topo primeiro; só sai do app quando a pilha esvazia
// e já está na primeira aba visitada.
// Estratégia: sempre que ainda há algo na pilha lógica (navStack), garantimos que existe
// uma entrada real no histórico do navegador para "absorver" o próximo voltar. Isso é
// necessário porque PWAs abertos direto (sem navegação orgânica) começam com histórico raso.
let navStack = ['tab:'+state.activeTab];
let suppressPushOnPop = false;

function isAnyModalOpen(){
  return !!(state.showMesPicker || state.showPagosView || state.showRetornosView ||
            state.showForm || state.batchPreview || state.showOrfaosConfirm ||
            state.showResetConfirm || (document.getElementById('patient-modal') && document.getElementById('patient-modal').style.display==='flex'));
}
function ensureHistoryAnchor(){
  // Garante que sempre exista uma entrada no histórico real para interceptar o próximo "voltar",
  // enquanto a pilha lógica (navStack) ainda tiver mais de 1 item.
  try{ history.pushState({navAnchor:true, depth:navStack.length}, '', location.href); }catch(_){}
}
function pushNavLayer(label){
  navStack.push(label);
  ensureHistoryAnchor();
}
function closeTopModalLayer(){
  // Fecha por prioridade a camada de modal mais "recente" visível
  if(state.showMesPicker){ state.showMesPicker=false; render(); return true; }
  if(state.showOrfaosConfirm){ state.showOrfaosConfirm=false; render(); return true; }
  if(state.showResetConfirm){ state.showResetConfirm=false; render(); return true; }
  if(state.batchPreview){ state.batchPreview=null; state.batchDate=null; render(); return true; }
  if(state.showForm){ state.showForm=false; state.editId=null; render(); return true; }
  if(state.showRetornosView){ state.showRetornosView=false; render(); return true; }
  if(state.showPagosView){ state.showPagosView=false; render(); return true; }
  const pm = document.getElementById('patient-modal');
  if(pm && pm.style.display==='flex'){ pm.style.display='none'; return true; }
  return false;
}
window.addEventListener('popstate', ()=>{
  if(ignoreNextPopstate){ ignoreNextPopstate=false; return; }
  // 1) Tenta fechar a camada de modal mais no topo
  if(closeTopModalLayer()){
    if(navStack.length>1) navStack.pop();
    // Ainda há itens na pilha lógica? Garante âncora no histórico para o próximo voltar.
    if(navStack.length>1) ensureHistoryAnchor();
    return;
  }
  // 2) Sem modais abertos: volta para a aba anterior na pilha, se houver
  if(navStack.length>1){
    navStack.pop();
    const top = navStack[navStack.length-1];
    if(top && top.startsWith('tab:')){
      const tab = top.slice(4);
      state.activeTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      const nb = document.getElementById('nav-'+tab);
      if(nb) nb.classList.add('active');
      const activeH = state.hospitals.find(h=>h.id===state.activeHosp);
      document.getElementById('topbar-title').textContent = (tab==='atendimentos'&&activeH) ? activeH.name : TITLES[tab];
      render();
    }
    // Ainda há mais de 1 aba na pilha? Garante âncora para o próximo voltar.
    if(navStack.length>1) ensureHistoryAnchor();
  }
  // 3) Se a pilha esvaziou (navStack.length<=1), não recriamos âncora: deixa o navegador
  // seguir o comportamento padrão (sair do app) na próxima vez que apertar voltar.
});

function showTab(tab, direction){
  const el = document.getElementById('content');

  function doSwitch(){
    if(tab !== state.activeTab) pushNavLayer('tab:'+tab);
    state.activeTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    const nb = document.getElementById('nav-'+tab);
    if(nb) nb.classList.add('active');
    const activeH = state.hospitals.find(h=>h.id===state.activeHosp);
    document.getElementById('topbar-title').textContent = (tab==='atendimentos'&&activeH) ? activeH.name : TITLES[tab];
    render();
    // Apply swipe animation (arrastar) ou fade elegante (clique normal no menu)
    el.classList.remove('swipe-anim-left','swipe-anim-right','tab-fade-in','tab-fade-out');
    void el.offsetWidth;
    if(direction){
      el.classList.add(direction==='left'?'swipe-anim-left':'swipe-anim-right');
    } else {
      el.classList.add('tab-fade-in');
    }
  }

  // Sempre faz um fade-out rápido do conteúdo atual antes de trocar — dá uma
  // sensação de transição suave e contínua, tanto no clique do menu quanto no
  // swipe (que na entrada mantém o deslizar na direção do gesto).
  if(tab !== state.activeTab){
    el.classList.remove('tab-fade-in','tab-fade-out','swipe-anim-left','swipe-anim-right');
    void el.offsetWidth;
    el.classList.add('tab-fade-out');
    setTimeout(doSwitch, 130);
  } else {
    doSwitch();
  }
}

// ── SWIPE GESTURE ────────────────────────────────────────────────────────────
let swipeStartX = 0;
let swipeStartY = 0;
let swipeActive = false;

document.addEventListener('DOMContentLoaded', () => {
  const content = document.getElementById('content');
  if(!content) return;

  content.addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeActive = true;
  }, {passive:true});

  content.addEventListener('touchmove', e => {
    if(!swipeActive) return;
    const dx = e.touches[0].clientX - swipeStartX;
    const dy = e.touches[0].clientY - swipeStartY;
    // Cancel if mostly vertical scroll
    if(Math.abs(dy) > Math.abs(dx)) { swipeActive = false; }
  }, {passive:true});

  content.addEventListener('touchend', e => {
    if(!swipeActive) return;
    swipeActive = false;
    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;
    if(Math.abs(dx) < 90 || Math.abs(dy) > Math.abs(dx)*0.8) return;
    const cur = TAB_ORDER.indexOf(state.activeTab);
    if(dx < 0 && cur < TAB_ORDER.length-1) {
      // Swipe left → next tab
      showTab(TAB_ORDER[cur+1], 'left');
    } else if(dx > 0 && cur > 0) {
      // Swipe right → previous tab
      showTab(TAB_ORDER[cur-1], 'right');
    }
  }, {passive:true});
});

  const scrollY = window.scrollY;

  if(state.activeTab==='inicio') c.innerHTML = renderInicio();
  else if(state.activeTab==='unidades') c.innerHTML = renderUnidades();
  else if(state.activeTab==='atendimentos') c.innerHTML = renderAtendimentos();
  else if(state.activeTab==='auditagem') c.innerHTML = renderAuditagem();
  else if(state.activeTab==='config') c.innerHTML = renderConfig();
  renderReviewCandidateModal();
  bindEvents();
  window.scrollTo(0, scrollY);
}

function abrirConfigHosp(id){
  const h = state.hospitals.find(h=>h.id===id);
  if(!h) return;

  // Calcula médias por convênio para este hospital
  const pagosHosp = state.patients.filter(p=>p.hospId===id && p.status==='PAGO' && (p.valorPago||p.valor)>0);
  const mediasPorConvenio = {};
  pagosHosp.forEach(p=>{
    const conv = (p.convenio||'Não informado').trim();
    if(!mediasPorConvenio[conv]) mediasPorConvenio[conv] = {total:0, count:0};
    mediasPorConvenio[conv].total += (p.valorPago||p.valor||0);
    mediasPorConvenio[conv].count += 1;
  });
  const convenios = Object.entries(mediasPorConvenio)
    .map(([conv,{total,count}])=>({conv, media:total/count, count}))
    .sort((a,b)=>b.media-a.media);

  const overlay = document.createElement('div');
  overlay.id = 'config-hosp-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;';
  overlay.onclick = (e)=>{ if(e.target===overlay) fecharConfigHosp(); };
  overlay.innerHTML = `
    <div class="glass" style="width:100%;max-width:380px;padding:24px;border-radius:24px;max-height:90vh;overflow-y:auto;">
      <div style="font-size:16px;font-weight:900;color:var(--text);margin-bottom:4px;">⚙️ ${h.name}</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:20px;">Configurações da unidade</div>

      <div style="margin-bottom:20px;">
        <label style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px;">Desconto sobre recebido (%)</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input id="config-hosp-desconto" type="number" min="0" max="100" step="0.1"
            placeholder="Ex: 27.5"
            value="${h.descontoPercent||''}"
            class="input" style="flex:1;font-size:16px;letter-spacing:1px;">
          <div style="font-size:12px;color:var(--text3);font-weight:700;white-space:nowrap;">%</div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:8px;">Aplicado no balão "Total Recebido" desta unidade.</div>
      </div>

      ${convenios.length>0?`
      <div style="margin-bottom:20px;">
        <div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">📊 Média histórica por convênio</div>
        <div style="background:rgba(255,255,255,0.5);border-radius:14px;overflow:hidden;">
          ${convenios.map((c,i)=>`
          <div style="padding:12px 14px;${i<convenios.length-1?'border-bottom:1px solid rgba(0,0,0,0.05);':''}">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-size:13px;font-weight:800;color:var(--text);">${c.conv}</div>
                <div style="font-size:11px;color:var(--text3);margin-top:2px;">${c.count} pagamento${c.count>1?'s':''} registrado${c.count>1?'s':''}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:14px;font-weight:900;color:var(--green2);">${fmtBRL(c.media)}</div>
                <div style="font-size:10px;color:var(--text3);font-weight:700;">média/paciente</div>
              </div>
            </div>
          </div>`).join('')}
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:8px;">Calculado automaticamente com base nos pagamentos já conciliados neste hospital.</div>
      </div>`:`
      <div style="background:rgba(255,255,255,0.5);border-radius:14px;padding:16px;margin-bottom:20px;text-align:center;">
        <div style="font-size:24px;margin-bottom:6px;">📊</div>
        <div style="font-size:12px;color:var(--text3);font-weight:700;">Nenhum pagamento conciliado ainda.<br>As médias aparecerão após as primeiras conciliações.</div>
      </div>`}

      <div style="display:flex;gap:10px;">
        <button onclick="fecharConfigHosp()" class="btn-g" style="flex:1;padding:13px;">Cancelar</button>
        <button onclick="salvarConfigHosp('${id}')" class="btn-p" style="flex:2;padding:13px;">💾 Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function fecharConfigHosp(){
  const ov = document.getElementById('config-hosp-overlay');
  if(ov) ov.remove();
}

function salvarConfigHosp(id){
  const val = parseFloat(document.getElementById('config-hosp-desconto')?.value||'0')||0;
  state.hospitals = state.hospitals.map(h=>h.id===id?{...h,descontoPercent:val>=0&&val<=100?val:0}:h);
  saveState();
  fecharConfigHosp();
  render();
  toast(`✓ Configurações salvas — desconto de ${val}%`,'success');
}

function salvarDescontoHosp(id){
  const val = parseFloat(document.getElementById(`desconto-${id}`)?.value||'0')||0;
  state.hospitals = state.hospitals.map(h=>h.id===id?{...h,descontoPercent:val>=0&&val<=100?val:0}:h);
  saveState();render();toast(`✓ Desconto de ${val}% salvo para este hospital`,'success');
}

function addHosp(){
  const n=document.getElementById('inp-hosp').value.trim();
  if(!n)return;
  const desconto=parseFloat(document.getElementById('inp-hosp-desconto')?.value||'0')||0;
  state.hospitals.push({id:uid(),name:n,descontoPercent:desconto>=0&&desconto<=100?desconto:0});
  saveState();render();toast('Unidade adicionada!','success');
}
function removeHosp(id){state.hospitals=state.hospitals.filter(h=>h.id!==id);if(state.activeHosp===id)state.activeHosp=null;confirmDeleteHospId=null;saveState();render();toast('Unidade removida','info');}
function activateHosp(id){
  state.activeHosp=id;saveState();
  const h = state.hospitals.find(h=>h.id===id);
  showTab('atendimentos');
  toast('Unidade ativa: '+( h?h.name:''),'success');
}

      <button type="button" onclick="markReturn('${state.editId}');state.showForm=false;state.editId=null;popNavLayer();render();" style="width:100%;padding:11px;border-radius:12px;border:none;background:linear-gradient(135deg,#5b8def,#3a6cd4);color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:10px;">↩ Marcar como Retorno</button>
      ` : ''}
      <div style="display:flex;gap:10px;">
        <button class="btn-p" style="flex:1;" onclick="savePatient()">${state.editId?'Salvar':'Confirmar'}</button>
        <button class="btn-g" onclick="state.showForm=false;state.editId=null;popNavLayer();render();">Cancelar</button>
      </div>
    </div>`:''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <div class="glass" style="padding:16px 18px;">
        <div class="lbl" style="margin-bottom:6px;">PACIENTES A RECEBER</div>
        <div style="font-size:36px;font-weight:900;color:var(--orange);">${pendentes.length}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px;font-weight:700;">aguardando pagamento</div>
      </div>
      <div class="glass" style="padding:16px 18px;">
        <div class="lbl" style="margin-bottom:4px;">TOTAL RECEBIDO</div>
        <div style="font-size:20px;font-weight:900;color:var(--green2);">${fmtBRL(tPago)}</div>
        ${(()=>{
          const hospAtivo = state.hospitals.find(h=>h.id===state.activeHosp);
          const desc = hospAtivo?.descontoPercent || state.profile?.descontoPercent || 0;
          if(desc>0){
            const liquido = tPago*(1-desc/100);
            return `<div style="font-size:11px;color:var(--text3);margin-top:2px;font-weight:700;">Líquido (${desc}%): <span style="color:var(--green2)">${fmtBRL(liquido)}</span></div>`;
          }
          return `<div style="font-size:11px;color:var(--text3);margin-top:4px;font-weight:700;">${pagos.length} conciliados</div>`;
        })()}
      </div>
    </div>
    ${(()=>{
      // Balão de pacientes do mês atual
      const hoje = new Date();
      const mmAtual = String(hoje.getMonth()+1).padStart(2,'0');
      const aaaAtual = String(hoje.getFullYear());
      const patsMesAtual = all.filter(a=>{
        if(!a.data) return false;
        const parts=a.data.split('-');
        if(parts.length===3) return parts[1]===mmAtual && parts[0]===aaaAtual;
        const d=new Date(a.data);
        return String(d.getMonth()+1).padStart(2,'0')===mmAtual && String(d.getFullYear())===aaaAtual;
      });
      if(patsMesAtual.length===0) return '';
      const nomeMes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][hoje.getMonth()];
      return `
      <div class="glass" style="padding:14px 18px;margin-bottom:10px;border-left:3px solid var(--green);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="lbl" style="margin-bottom:2px;">ATENDIDOS EM ${nomeMes.toUpperCase()}</div>
            <div style="font-size:28px;font-weight:900;color:var(--green2);">${patsMesAtual.length} <span style="font-size:14px;color:var(--text3);">pacientes</span></div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:11px;color:var(--text3);font-weight:700;">${patsMesAtual.filter(a=>a.status==='PAGO').length} pagos</div>
            <div style="font-size:11px;color:var(--orange);font-weight:700;">${patsMesAtual.filter(a=>a.status!=='PAGO'&&a.status!=='RETORNO').length} pendentes</div>
          </div>
        </div>
      </div>`;
    })()}

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
      <button onclick="openMesPicker('atendimentos')" style="flex:1;padding:11px 14px;font-size:13px;border-radius:14px;text-align:left;display:flex;align-items:center;gap:8px;
        background:linear-gradient(135deg,rgba(255,255,255,0.58),rgba(255,255,255,0.38));color:var(--lead);border:1px solid rgba(255,255,255,0.70);font-weight:800;
        font-family:inherit;cursor:pointer;">
        📅 ${state.mesFiltro==='TODOS'?'Todos os períodos':state.mesFiltro}
      </button>
      <button onclick="state.showPagosView=true;pushNavLayer('modal:pagos');render();" style="padding:11px 14px;font-size:13px;border-radius:14px;white-space:nowrap;
        background:linear-gradient(135deg,#35d46e,#22a852,#1a8f45);color:#fff;border:none;box-shadow:0 3px 10px rgba(46,200,102,0.30);font-weight:800;
        font-family:inherit;cursor:pointer;">✓ Pagos</button>
      <button onclick="state.showRelatorio=!state.showRelatorio;render();" style="padding:11px 14px;font-size:13px;border-radius:14px;white-space:nowrap;
        background:linear-gradient(135deg,rgba(255,255,255,0.58),rgba(255,255,255,0.38));color:${state.showRelatorio?'var(--green2)':'var(--lead)'};border:1px solid rgba(255,255,255,0.70);font-weight:700;font-family:inherit;cursor:pointer;">📊</button>
    </div>
    ${(()=>{
      const retornos = all.filter(a=>a.status==='RETORNO');
      return retornos.length>0 ? `
      <button onclick="state.showRetornosView=true;pushNavLayer('modal:retornos');render();" style="width:100%;padding:10px 14px;font-size:12px;border-radius:12px;margin-bottom:14px;text-align:left;display:flex;align-items:center;gap:8px;
        background:rgba(91,141,239,0.08);color:#3a6cd4;border:1px solid rgba(91,141,239,0.18);font-weight:800;font-family:inherit;cursor:pointer;">
        ↩ ${retornos.length} paciente${retornos.length>1?'s':''} em Retorno
      </button>` : '';
    })()}
    ${renderMesPickerModal()}

    ${state.showRelatorio?`
    <div class="glass anim-up" style="padding:20px;margin-bottom:16px;">
      <div style="font-size:14px;font-weight:900;color:var(--text);margin-bottom:16px;">📊 Relatório por Convênio</div>
      ${porConvenio.length===0?`<div style="font-size:13px;color:var(--text3);text-align:center;padding:16px;">Nenhum dado no período</div>`:
        porConvenio.map(({c,pend,pago})=>`
        <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(0,0,0,0.05);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="font-weight:800;font-size:13px;color:var(--text);">${c}</div>
            <div style="font-size:11px;color:var(--text3);font-weight:700;">${pend.length+pago.length} pac.</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div style="background:rgba(217,122,0,0.08);border-radius:10px;padding:8px 12px;">
              <div style="font-size:10px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:.5px;">A receber</div>
              <div style="font-size:14px;font-weight:900;color:var(--orange);margin-top:2px;">${fmtBRL(pend.reduce((s,a)=>s+(a.valor||0),0))}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:1px;">${pend.length} pac.</div>
            </div>
            <div style="background:rgba(46,200,102,0.08);border-radius:10px;padding:8px 12px;">
              <div style="font-size:10px;font-weight:800;color:var(--green2);text-transform:uppercase;letter-spacing:.5px;">Recebido</div>
              <div style="font-size:14px;font-weight:900;color:var(--green2);margin-top:2px;">${fmtBRL(pago.reduce((s,a)=>s+(a.valorPago||a.valor||0),0))}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:1px;">${pago.length} pac.</div>
            </div>
          </div>
          <div class="rel-bar"><div class="rel-bar-fill" style="width:${pago.length+pend.length>0?Math.round(pago.length/(pago.length+pend.length)*100):0}%;"></div></div>
          <div style="font-size:10px;color:var(--text3);margin-top:4px;font-weight:600;text-align:right;">${pago.length+pend.length>0?Math.round(pago.length/(pago.length+pend.length)*100):0}% conciliado</div>
        </div>`).join('')}
      <div style="background:rgba(46,200,102,0.06);border-radius:14px;padding:12px 16px;border:1px solid rgba(46,200,102,0.12);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:12px;font-weight:800;color:var(--text2);">TOTAL GERAL</div>
          <div style="font-size:14px;font-weight:900;color:var(--green2);">${fmtBRL(tPago+tPend)}</div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px;">${pagos.length} pagos · ${pendentes.length} pendentes</div>
      </div>
    </div>`:''}

    ${all.length===0?`<div class="glass anim-up" style="padding:48px;text-align:center;"><div style="font-size:48px;margin-bottom:12px;">🌿</div><div style="font-weight:800;color:var(--text2);">Sem registros</div><div style="font-size:13px;color:var(--text3);margin-top:6px;">Capture com IA ou adicione manualmente.</div></div>`:''}

    ${pendentes.length>0?`
    <div style="margin-bottom:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="lbl">Pacientes a Receber (${pendentes.length})</div>
      </div>
      ${pendentes.map(a=>{
        const exp = state.expandId === a.id;
        return `
        <div class="glass anim-up" style="margin-bottom:10px;border-left:3px solid var(--orange);overflow:hidden;">
          <div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;">
            <div style="flex:1;min-width:0;margin-right:10px;">
              <div onclick="openPatientModal('${a.id}')" style="font-weight:900;font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;">${a.nome}</div>
              <div style="font-size:12px;color:var(--text3);margin-top:3px;">
                ID: <span style="font-weight:700;">${a.atendimento}</span>
                ${a.convenio?' · <span style="color:var(--lead);font-weight:700;">'+a.convenio+'</span>':''}
              </div>
            </div>
            <button onclick="state.expandId=state.expandId==='${a.id}'?null:'${a.id}';render();"
              style="padding:8px 13px;border-radius:12px;border:1px solid rgba(0,0,0,0.08);
              background:rgba(255,255,255,0.60);color:var(--text3);font-size:15px;cursor:pointer;
              font-family:inherit;font-weight:900;flex-shrink:0;">
              ${exp?'▲':'···'}
            </button>
          </div>
          ${exp?`
          <div style="padding:0 16px 16px;border-top:1px solid rgba(0,0,0,0.06);">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 14px;">
              <div style="background:rgba(255,255,255,0.65);border-radius:12px;padding:10px 12px;">
                <div style="font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;">Paciente</div>
                <div style="font-size:13px;font-weight:800;color:var(--text);margin-top:3px;word-break:break-word;">${a.nome||'—'}</div>
              </div>
              <div style="background:rgba(255,255,255,0.65);border-radius:12px;padding:10px 12px;">
                <div style="font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;">Atendimento</div>
                <div style="font-size:13px;font-weight:800;color:var(--text);margin-top:3px;">${a.atendimento||'—'}</div>
              </div>
              <div style="background:rgba(255,255,255,0.65);border-radius:12px;padding:10px 12px;">
                <div style="font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;">Convênio</div>
                <div style="font-size:13px;font-weight:800;color:var(--text);margin-top:3px;">${a.convenio||'—'}</div>
              </div>
              <div style="background:rgba(255,255,255,0.65);border-radius:12px;padding:10px 12px;">
                <div style="font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;">Data do Atendimento</div>
                <div style="font-size:13px;font-weight:800;color:var(--text);margin-top:3px;">${fmtDt(a.data)}</div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${confirmDeleteId===a.id?`
                <div style="display:flex;gap:8px;">
                  <button onclick="confirmDeleteId=null;render();" style="flex:1;padding:11px;border-radius:12px;border:none;font-size:13px;font-weight:800;cursor:pointer;background:rgba(255,255,255,0.70);color:var(--lead);font-family:inherit;">Cancelar</button>
                  <button onclick="removePatient('${a.id}')" style="flex:1;padding:11px;border-radius:12px;border:none;font-size:13px;font-weight:800;cursor:pointer;background:var(--red);color:#fff;font-family:inherit;">Apagar</button>
                </div>
              `:`
                <div style="display:flex;gap:8px;">
                  <button onclick="markPaid('${a.id}')" style="flex:1;padding:11px;border-radius:12px;border:none;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#35d46e,#1a8f45);color:#fff;">✓ Pago</button>
                  <button onclick="markReturn('${a.id}')" style="flex:1;padding:11px;border-radius:12px;border:none;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#5b8def,#3a6cd4);color:#fff;">↩ Retorno</button>
                </div>
                <div style="display:flex;gap:8px;">
                  <button onclick="editPatient('${a.id}')" style="flex:1;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.70);background:rgba(255,255,255,0.58);color:var(--lead);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">✎ Editar</button>
                  <button onclick="askDelete('${a.id}')" style="flex:1;padding:10px 14px;border-radius:12px;border:1px solid rgba(217,64,64,0.14);background:rgba(217,64,64,0.07);color:var(--red);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">🗑 Apagar</button>
                </div>
              `}
            </div>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`:''}

    ${pagos.length>0?`
    <div style="opacity:.85;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="lbl">Conciliados (${pagos.length})</div>
        <div style="font-size:13px;font-weight:800;color:var(--green2);">${fmtBRL(tPago)}</div>
      </div>
      ${pagos.map(a=>`
      <div class="glass anim-up" style="padding:12px 16px;margin-bottom:8px;border-left:3px solid var(--green);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="flex:1;min-width:0;margin-right:10px;">
            <div style="font-weight:800;font-size:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.nome}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px;">${fmtDt(a.data)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:800;font-size:14px;color:var(--green2);">${fmtBRL(a.valorPago||a.valor)}</div>
            <span class="badge-g" style="margin-top:4px;">✓ Pago</span>
          </div>
        </div>
      </div>`).join('')}
    </div>`:''}${renderPagosView()}${renderRetornosView()}`;
}

function renderRetornosView(){
  if(!state.showRetornosView) return '';
  const all = state.patients.filter(p=>p.hospId===state.activeHosp);
  const retornos = all.filter(a=>a.status==='RETORNO');
  return `
  <div style="position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto;padding:20px;padding-bottom:40px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div style="font-size:17px;font-weight:900;color:var(--text);">↩ Pacientes em Retorno</div>
      <button onclick="state.showRetornosView=false;popNavLayer();render();" style="width:36px;height:36px;border-radius:12px;border:none;background:rgba(255,255,255,0.60);color:var(--text3);font-size:16px;cursor:pointer;font-family:inherit;font-weight:900;">✕</button>
    </div>

    <div class="glass" style="padding:14px 16px;margin-bottom:18px;background:rgba(91,141,239,0.07);">
      <div style="font-size:12px;color:var(--text3);font-weight:600;line-height:1.5;">Pacientes em retorno não contam como pendentes e não geram cobrança.</div>
    </div>

    ${retornos.length===0?`<div class="glass anim-up" style="padding:40px;text-align:center;"><div style="font-size:40px;margin-bottom:10px;">🌿</div><div style="font-weight:800;color:var(--text2);">Nenhum paciente em retorno</div></div>`:
      retornos.map(a=>`
      <div class="glass anim-up" style="padding:12px 16px;margin-bottom:8px;border-left:3px solid #5b8def;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:800;font-size:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.nome}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px;">ID: ${a.atendimento}${a.convenio?' · '+a.convenio:''}</div>
          </div>
          <button onclick="unmarkReturn('${a.id}')" style="padding:9px 13px;border-radius:11px;border:1px solid rgba(91,141,239,0.25);background:rgba(91,141,239,0.10);color:#3a6cd4;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;">Reverter</button>
        </div>
      </div>`).join('')}
  </div>`;
}

function renderPagosView(){
  if(!state.showPagosView) return '';
  const all = state.patients.filter(p=>p.hospId===state.activeHosp);
  let pagos = all.filter(a=>a.status==='PAGO');
  if(state.pagosFiltro!=='TODOS'){
    pagos = pagos.filter(a=>{
      if(!a.data) return false;
      const parts=a.data.split('-');
      let mm,yyyy;
      if(parts.length===3){mm=parts[1];yyyy=parts[0];}
      else{const d=new Date(a.data);mm=String(d.getMonth()+1).padStart(2,'0');yyyy=String(d.getFullYear());}
      return `${mm}/${yyyy}`===state.pagosFiltro;
    });
  }
  const total = pagos.reduce((s,a)=>s+(a.valorPago||a.valor||0),0);
  return `
  <div style="position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto;padding:20px;padding-bottom:40px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div style="font-size:17px;font-weight:900;color:var(--text);">✓ Pacientes Pagos</div>
      <button onclick="state.showPagosView=false;popNavLayer();render();" style="width:36px;height:36px;border-radius:12px;border:none;background:rgba(255,255,255,0.60);color:var(--text3);font-size:16px;cursor:pointer;font-family:inherit;font-weight:900;">✕</button>
    </div>

    <button onclick="openMesPicker('pagos')" style="width:100%;padding:11px 14px;font-size:13px;border-radius:14px;text-align:left;display:flex;align-items:center;gap:8px;margin-bottom:16px;
      background:linear-gradient(135deg,rgba(255,255,255,0.58),rgba(255,255,255,0.38));color:var(--lead);border:1px solid rgba(255,255,255,0.70);font-weight:800;
      font-family:inherit;cursor:pointer;">
      📅 ${state.pagosFiltro==='TODOS'?'Todos os períodos':state.pagosFiltro}
    </button>

    <div class="glass" style="padding:16px 18px;margin-bottom:18px;background:linear-gradient(145deg,rgba(46,200,102,0.10),rgba(46,200,102,0.04));">
      <div class="lbl" style="margin-bottom:6px;">TOTAL RECEBIDO NO PERÍODO</div>
      <div style="font-size:24px;font-weight:900;color:var(--green2);">${fmtBRL(total)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px;font-weight:700;">${pagos.length} pacientes</div>
    </div>

    ${pagos.length===0?`<div class="glass anim-up" style="padding:40px;text-align:center;"><div style="font-size:40px;margin-bottom:10px;">🌿</div><div style="font-weight:800;color:var(--text2);">Nenhum pago neste período</div></div>`:
      pagos.map(a=>`
      <div class="glass anim-up" style="padding:12px 16px;margin-bottom:8px;border-left:3px solid var(--green);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="flex:1;min-width:0;margin-right:10px;">
            <div style="font-weight:800;font-size:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.nome}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px;">${fmtDt(a.data)}${a.convenio?' · '+a.convenio:''}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:800;font-size:14px;color:var(--green2);">${fmtBRL(a.valorPago||a.valor)}</div>
            <span class="badge-g" style="margin-top:4px;">✓ Pago</span>
          </div>
        </div>
      </div>`).join('')}
    ${renderMesPickerModal()}
  </div>`;
}

function toggleForm(){
  const opening = !state.showForm;
  state.showForm=!state.showForm;state.editId=null;
  if(opening) pushNavLayer('modal:form'); else popNavLayer();
  render();
}
function editPatient(id){
  state.editId=id;

async function handleExcelImport(input){
  const file = input.files[0];
  if(!file) return;
  toast('Lendo planilha...','info');
  try {
    const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf,{type:'array'});
    const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
    if(!rawRows.length){ toast('Planilha vazia','error'); return; }

    // Alguns relatórios (ex: exportações de RH/financeiro) têm um bloco de
    // título/metadados antes da tabela de verdade. Escaneia as primeiras 25
    // linhas em busca da que tem mais palavras-chave de cabeçalho batendo —
    // essa é a linha real de cabeçalho, não necessariamente a primeira.
    const nn = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').trim();
    const HEADER_KEYWORDS = ['nome','paciente','patient','atendimento','protocolo','convenio','plano','operadora','data','medico'];
    let headerRowIdx = 0, bestScore = -1;
    for(let i=0; i<Math.min(25, rawRows.length); i++){
      const row = rawRows[i];
      if(!Array.isArray(row)) continue;
      const score = row.filter(cell => HEADER_KEYWORDS.some(kw => nn(cell).includes(kw))).length;
      if(score > bestScore){ bestScore = score; headerRowIdx = i; }
    }

    const headers = rawRows[headerRowIdx].map(h => String(h||'').trim());
    // Evita que colunas com o MESMO nome (ex: duas colunas "Paciente" na
    // mesma planilha) se sobrescrevam — mantém a primeira intacta e renomeia
    // as repetições seguintes, sem perder nenhum dado.
    const seenHeaders = {};
    const uniqueHeaders = headers.map(h => {
      if(!h) return h;
      if(!seenHeaders[h]){ seenHeaders[h] = 1; return h; }
      seenHeaders[h]++;
      return `${h}_${seenHeaders[h]}`;
    });
    const dataRows = rawRows.slice(headerRowIdx + 1)
      .filter(r => Array.isArray(r) && r.some(c => String(c||'').trim() !== ''))
      .map(r => {
        const obj = {};
        uniqueHeaders.forEach((h, idx) => { if(h) obj[h] = r[idx] !== undefined ? r[idx] : ''; });
        return obj;
      });

    if(!dataRows.length){ toast('Planilha vazia','error'); return; }

    // Tenta mapear colunas automaticamente
    const findCol = (row, keywords) => Object.keys(row).find(k=>keywords.some(kw=>nn(k).includes(nn(kw))));

    const firstRow = dataRows[0];
    const colNome   = findCol(firstRow,['nome','paciente','patient']);
    const colAtd    = findCol(firstRow,['atendimento','protocolo','numero','atend']);
    const colConv   = findCol(firstRow,['convenio','plano','operadora']);
    const colData   = findCol(firstRow,['data','date']);

    const imported = dataRows.map(r=>({
      nome: colNome ? String(r[colNome]||'') : '',
      atendimento: colAtd ? String(r[colAtd]||'') : '',
      convenio: colConv ? String(r[colConv]||'') : '',
      data: colData ? today() : today()
    })).filter(r=>r.nome||r.atendimento);

    if(!imported.length){ toast('Nenhum paciente encontrado na planilha','error'); return; }

    state.batchPreview = imported;
    pushNavLayer('modal:batchPreview');
    render();
    toast(`${imported.length} pacientes encontrados — revise e confirme`,'success');
  } catch(e) {
    toast('Erro ao ler planilha: '+e.message,'error');
    console.error(e);
  }
}

// ── COMPRESSÃO DE IMAGEM E SUPORTE HEIC ─────────────────────────────────────
function isHeicFile(file){
  const name = (file.name||'').toLowerCase();
  return name.endsWith('.heic') || name.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';
}
async function resizeImageToBase64(file, maxSide=1200, quality=0.85){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(objectUrl);
      let width = img.width, height = img.height;
      if(width > height){ if(width > maxSide){ height = Math.round(height*maxSide/width); width = maxSide; } }
      else { if(height > maxSide){ width = Math.round(width*maxSide/height); height = maxSide; } }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      if(!ctx){ reject(new Error('Não foi possível processar a imagem')); return; }
      // Pré-processamento visual: escala de cinza + contraste +20% para melhorar leitura de etiquetas
      try {
        if('filter' in ctx){
          ctx.filter = 'grayscale(100%) contrast(1.20)';
          console.log('🎨 Pré-processamento visual aplicado: contraste +20%, escala de cinza');
        }
      } catch(e){
        console.warn('⚠️ Filtro canvas não suportado, usando imagem original:', e);
      }
      ctx.drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); reject(new Error('Falha ao carregar a imagem')); };
    img.src = objectUrl;
  });
}
async function prepareFileForUpload(file){
  // PDFs e HEIC: envia como está (sem recompressão por canvas, que não suporta esses formatos)
  if(file.type === 'application/pdf'){
    if(file.size > 8*1024*1024) throw new Error('PDF muito grande (máx. 8MB). Tire uma foto da página em vez de enviar o PDF.');
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { base64, mimeType: 'application/pdf' };
  }
  if(isHeicFile(file)){
    // HEIC: tenta converter via canvas (funciona na maioria dos browsers modernos)
    // Se falhar, envia direto mas com limite de tamanho mais restrito
    try {
      return await resizeImageToBase64(file, 1200, 0.85);
    } catch(e){
      console.warn('⚠️ Canvas não suportou HEIC, enviando direto:', e.message);
      if(file.size > 3*1024*1024) throw new Error('Imagem muito grande (máx. 3MB). Nas configurações da câmera, mude o formato para JPEG/Alta Eficiência compatível.');
      const base64 = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = ()=>res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      return { base64, mimeType: file.type || 'image/heic' };
    }
  }
  // Imagens comuns (jpg, png, etc): comprime para economizar dados e cota da IA
  try {
    const result = await resizeImageToBase64(file, 1200, 0.85);
    const sizeKB = Math.round(result.base64.length * 0.75 / 1024);
    console.log(`📦 Imagem comprimida: ${sizeKB}KB (original: ${Math.round(file.size/1024)}KB)`);
    if(sizeKB > 2048){
      // Se ainda ficou grande após compressão, tenta com qualidade menor
      console.warn(`⚠️ Imagem ainda grande (${sizeKB}KB), recomprimindo com qualidade menor...`);
      return await resizeImageToBase64(file, 1000, 0.70);
    }
    return result;
  } catch(e){
    // Fallback: se a compressão falhar, bloqueia arquivos muito grandes
    console.error('❌ Compressão falhou:', e.message);
    if(file.size > 2*1024*1024) throw new Error(`Imagem muito grande (${Math.round(file.size/1024/1024)}MB). Tire uma foto mais próxima ou reduza a resolução da câmera nas configurações.`);
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { base64, mimeType: file.type || 'image/jpeg' };
  }
}
function friendlyAiError(status, rawMessage){
  const msg = (rawMessage||'').toLowerCase();
  if(status===429 || msg.includes('quota') || msg.includes('resource_exhausted')){
    return 'Limite de uso da IA atingido temporariamente. Aguarde 1 minuto e tente novamente.';
  }
  if(status===401 || status===403 || msg.includes('invalid') && msg.includes('key')){
    return 'Chave de acesso à IA inválida ou expirada. Verifique a configuração em Ajustes.';
  }
  if(status===413 || msg.includes('too large') || msg.includes('payload')){
    return 'Arquivo muito grande para processar. Tire uma foto mais simples ou em menor resolução.';
  }
  if(status>=500){
    return 'O servidor de IA está indisponível no momento. Tente novamente em alguns instantes.';
  }
  if(msg.includes('failed to fetch') || msg.includes('network')){
    return 'Falha de conexão. Verifique sua internet e tente novamente.';
  }
  return 'Erro ao processar imagem. Tente novamente.';
}
