async function handleCamera(input){
  const files = Array.isArray(input.files) ? input.files : Array.from(input.files||[]);
  if(!files.length) return;

  // Mensagem de progresso persistente
  const toastEl = document.createElement('div');
  toastEl.id = 'scan-toast';
  toastEl.className = 'toast toast-info';
  toastEl.style.cssText = 'pointer-events:auto;';
  toastEl.innerHTML = '<span>⏳</span><div><div style="font-weight:800;">Analisando com IA...</div><div id="scan-msg" style="font-size:11px;opacity:.7;margin-top:2px;">Processando imagem...</div></div>';
  document.getElementById('toasts').appendChild(toastEl);

  const msgs = [
    'Identificando pacientes...',
    'Lendo convênios e atendimentos...',
    'Extraindo dados das etiquetas...',
    'Quase lá, finalizando análise...',
    'A IA ainda está processando...',
    'Imagens com muitas etiquetas podem demorar mais...',
    'Aguarde, processando lote completo...'
  ];
  let msgIdx = 0;
  const msgInterval = setInterval(()=>{
    const msgEl = document.getElementById('scan-msg');
    if(msgEl){ msgEl.textContent = msgs[msgIdx % msgs.length]; msgIdx++; }
  }, 5000);
  toastEl._interval = msgInterval;

  const allPacientes = [];
  let quotaExhaustedFlag = false;

  try {
    for(let fi=0; fi<files.length; fi++){
      const file = files[fi];

      // Converte imagem para base64 (com compressão automática e suporte a HEIC/PDF)
      let base64, mimeType;
      try {
        const prepared = await prepareFileForUpload(file);
        base64 = prepared.base64;
        mimeType = prepared.mimeType;
      } catch(prepErr){
        throw new Error(prepErr.message || 'Falha ao preparar a imagem para envio');
      }

      // Mostra progresso
      const msgEl0 = document.getElementById('scan-msg');
      if(msgEl0) msgEl0.textContent = files.length>1 ? `Processando foto ${fi+1} de ${files.length}...` : 'Enviando para a IA...';

      const extractController = new AbortController();
      const extractTimeoutId = setTimeout(()=>{
        extractController.abort();
        console.warn('⚠️ Timeout de 90s atingido.');
      }, 90000);

      let data;
      try {
        const response = await fetch(`${AI_URL}/public/extract`, {
          method: 'POST',
          headers: { 'Accept':'application/json', 'Content-Type': 'application/json', 'x-api-key': AI_KEY },
          signal: extractController.signal,
          body: JSON.stringify({
            fileBase64: base64,
            filename: file.name || 'etiqueta.jpg',
            mimeType: mimeType,
            prompt: `Analise esta imagem. Antes de extrair qualquer dado, identifique mentalmente o tipo de documento:
- ETIQUETA FÍSICA INDIVIDUAL
- TELA DE SISTEMA DIGITAL
- TABELA/LISTA DE AGENDA (múltiplos pacientes)
- FOLHA CIRÚRGICA / DESCRIÇÃO OPERATÓRIA

Extraia EXATAMENTE estes campos para CADA paciente encontrado:
- nome_paciente: nome completo do paciente. NUNCA confunda com nome de médico (identificado por "Dr.", "Dra." ou CRM)
- numero_atendimento: número de atendimento
- convenio: convênio ou plano de saúde — OBRIGATÓRIO. Em etiquetas: "Conv:", "Convênio:", "Plano:". Em telas de sistema: "Classe:". Em tabelas de agenda: coluna após o número de atendimento. Nunca deixe vazio. Se aparecer truncado (ex: "BRADESCO SE..."), complete com o nome correto ("Bradesco Saúde").
- data_atendimento: data de entrada/atendimento em DD/MM/YYYY. NUNCA use a data de nascimento ("DTNasc:", "Nasc:")
- data_nascimento: data de nascimento se disponível

REGRAS POR TIPO DE DOCUMENTO:

ETIQUETA FÍSICA: use OCR letra por letra com fidelidade absoluta. NUNCA aplique lógica de colunas ou tabela — isso embaralha os nomes. Para letras parcialmente visíveis, reconstrua caractere por caractere.

TELA DE SISTEMA: filtre ruídos de interface. Busque "Classe:" como sinônimo de convênio. Diferencie nome do paciente de nomes de médicos.

TABELA DE AGENDA (use SOMENTE se identificar explicitamente múltiplos pacientes em formato de tabela): cada linha é um paciente no formato [Nº Atendimento | Convênio | Hora | Nome | Status | Data]. Exemplo: "5315008 Sul América 13:00 Rafael de Oliveira Barbosa Executada 23/06/2026"

FOLHA CIRÚRGICA: extraia dados do cabeçalho. NUNCA confunda cirurgião ("Cirurgião:", "Dr.") com nome do paciente ("Paciente:", "Nome:", "Beneficiário:").

DADOS ILEGÍVEIS: se completamente ilegível por reflexo ou rasura severa, deixe o campo vazio. Para dados parcialmente visíveis, tente reconstruir.

Retorne todos os pacientes encontrados no array "pacientes".`
          })
        });
        clearTimeout(extractTimeoutId);

        if(!response.ok){
          let rawMsg = '';
          try { const errBody = await response.json(); rawMsg = errBody.error || errBody.message || ''; } catch(_){}
          throw new Error(friendlyAiError(response.status, rawMsg));
        }

        data = await response.json();

      } catch(fetchErr){
        clearTimeout(extractTimeoutId);
        if(fetchErr.name==='AbortError'){
          throw new Error('O servidor de IA demorou demais (90s). Toque em "↺ Retentar".');
        }
        throw new Error('Falha de conexão com o servidor de IA. Verifique sua internet e tente novamente.');
      }

      const a = data.analysis || data.data || data;
      const imageHash = data.image_hash || a.image_hash || '';
      if(data.quotaExhausted === true) quotaExhaustedFlag = true;

      let pacientes = [];
      const dataNode = a.data || a;

      if(dataNode.etiquetas && Array.isArray(dataNode.etiquetas) && dataNode.etiquetas.length > 0){
        pacientes = dataNode.etiquetas;
      } else if(dataNode.pacientes && Array.isArray(dataNode.pacientes)){
        pacientes = dataNode.pacientes;
      } else if(Array.isArray(dataNode)){
        pacientes = dataNode;
      } else if(dataNode.nome_paciente || dataNode.nome){
        pacientes = [dataNode];
      } else {
        const arr = Object.values(dataNode).find(v => Array.isArray(v) && v.length > 0);
        if(arr) pacientes = arr;
      }
      console.log('[MedReconcile] Pacientes encontrados:', pacientes.length);

      const mapped = pacientes.map(p=>{
        const conv = p.convenio || p.insurance || p.plano || p.plano_saude || p.nome_convenio || p.operadora || p.seguradora || p.plano_de_saude ||
                     dataNode.convenio || dataNode.insurance || a.convenio || a.insurance || '';
        if(!conv) console.warn('[MedReconcile] Convenio vazio para:', p, 'dataNode:', dataNode);
        return {
          nome: p.nome_paciente || p.nome || p.paciente || '',
          atendimento: p.numero_atendimento || p.atendimento || p.num_atendimento || p.id_atendimento || '',
          convenio: conv,
          data: p.data_atendimento || p.data_internacao || p.data || today(),
          aiSourceHash: imageHash
        };
      }).filter(p=>p.nome||p.atendimento);

      allPacientes.push(...mapped);
      console.log(`[MedReconcile] Foto ${fi+1}/${files.length}: ${mapped.length} pacientes`);
    } // fim do loop de arquivos

    // Remove mensagem de progresso
    const scanToast = document.getElementById('scan-toast');
    if(scanToast){ clearInterval(scanToast._interval); scanToast.remove(); }

    if(!allPacientes.length){ toast('Nenhum paciente identificado na(s) imagem(ns)','error'); return; }

    state.batchPreview = allPacientes;
    state.batchDate = today();
    pushNavLayer('modal:batchPreview');
    render();
    toast(allPacientes.length > 1
      ? `✓ ${allPacientes.length} pacientes encontrados — revise e confirme`
      : '✓ Etiqueta lida! Revise e confirme','success');
    if(quotaExhaustedFlag){
      setTimeout(()=>{
        toast('⚠️ Usando processamento pago — cota gratuita esgotada hoje. Renova à meia-noite.','info');
      }, 1200);
    }

  } catch(e) {
    const scanToastErr = document.getElementById('scan-toast');
    if(scanToastErr){ clearInterval(scanToastErr._interval); scanToastErr.remove(); }
    console.error('[MedReconcile] Erro na extração:', e);
    // Salva arquivos que falharam para poder retentar sem tirar nova foto
    if(files && files.length > 0){
      state.photoQueueFailed = [...(state.photoQueueFailed||[]), ...Array.from(files)];
    }
    let friendly = 'Erro ao processar imagem.';
    if(e && e.message){
      if(e.name==='AbortError'||e.message.toLowerCase().includes('abort')){
        friendly = 'Servidor demorou demais (90s). Toque em "↺ Retentar" para tentar novamente sem tirar nova foto.';
      } else if(e.message.includes('grande')||e.message.includes('Limite')||e.message.includes('Chave')||e.message.includes('indisponível')||e.message.includes('conexão')||e.message.includes('preparar')||e.message.includes('carregar')){
        friendly = e.message;
      } else {
        friendly = `Erro: ${e.message}`;
      }
    }
    render();
    toast(friendly,'error');
  }
}

function confirmarLote(){
  if(!state.batchPreview)return;
  const dataLote = state.batchDate || today();
  const nn = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

  // Evita duplicar pacientes já salvos (mesmo nome + mesma data de atendimento) —
  // acontece quando a mesma tela/etiqueta é fotografada mais de uma vez para
  // capturar pacientes que rolaram para fora da primeira foto.
  const jaExistentes = new Set(
    state.patients
      .filter(p=>p.hospId===state.activeHosp && p.data===dataLote)
      .map(p=>nn(p.nome))
  );

  const novos = [];
  const duplicados = [];
  const vistosNoLote = new Set();

  state.batchPreview.forEach(p=>{
    const chave = nn(p.nome);
    if(!chave){ novos.push(p); return; } // sem nome, deixa passar (não dá pra comparar)
    if(jaExistentes.has(chave) || vistosNoLote.has(chave)){
      duplicados.push(p.nome);
    } else {
      vistosNoLote.add(chave);
      novos.push(p);
    }
  });

  novos.forEach(p=>state.patients.push({
    id:uid(),
    hospId:state.activeHosp,
    ...p,
    data:dataLote,
    valor:0,
    status: p.isRetorno===true ? 'RETORNO' : 'PENDENTE'
  }));
  saveState();
  state.batchPreview=null;
  state.batchDate=null;
  popNavLayer();
  render();
  const retornos = novos.filter(p=>p.isRetorno===true).length;
  let msg = `✓ ${novos.length} paciente${novos.length!==1?'s':''} salvo${novos.length!==1?'s':''}!`;
  if(retornos>0) msg += ` (${retornos} marcado${retornos>1?'s':''} como retorno)`;
  if(duplicados.length>0) msg += ` — ${duplicados.length} duplicata${duplicados.length>1?'s':''} ignorada${duplicados.length>1?'s':''}`;
  toast(msg, duplicados.length>0 && novos.length===0 ? 'info' : 'success');
}

// Normaliza qualquer formato de data (DD/MM/AA, DD/MM/AAAA, YYYY-MM-DD) para YYYY-MM-DD.
// Retorna null se não conseguir interpretar — nesse caso o matching cai para o fallback por nome.
function normalizarDataParaComparacao(dataStr){
  if(!dataStr) return null;
  const s = String(dataStr).trim();
  // Formato já ISO: YYYY-MM-DD
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  // Formato BR: DD/MM/AAAA, DD/MM/AA, DD.MM.AAAA ou DD.MM.AA
  m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/);
  if(m){
    let [,dd,mm,yy] = m;
    dd = dd.padStart(2,'0'); mm = mm.padStart(2,'0');
    if(yy.length===2) yy = (parseInt(yy,10) > 50 ? '19' : '20') + yy; // heurística simples para 2 dígitos
    return `${yy}-${mm}-${dd}`;
  }
  return null;
}
function datasBatem(dataLocal, dataRelatorio){
  const a = normalizarDataParaComparacao(dataLocal);
  const b = normalizarDataParaComparacao(dataRelatorio);
  if(!a || !b) return null; // não deu pra comparar — indefinido, não é match nem descarte
  return a === b;
}

async function handleRelatorio(input){
  const file = input.files[0];
  if(!file) return;
  
  const pends = state.patients.filter(p=>p.hospId===state.activeHosp&&p.status!=='PAGO'&&p.status!=='RETORNO');
  if(!pends.length){toast('Nenhum paciente pendente para conciliar','info');return;}

  const name = file.name.toLowerCase();
  
  // Excel/CSV: leitura local
  if(name.endsWith('.xlsx')||name.endsWith('.xls')||name.endsWith('.xlsb')||name.endsWith('.csv')){
    toast('Lendo planilha...','info');
    try {
      const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf,{type:'array'});
      const nn = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();

      // Alguns relatórios têm um bloco de título/metadados antes da tabela
      // de verdade — escaneia as primeiras 25 linhas em busca da que tem
      // mais palavras-chave de cabeçalho batendo.
      const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
      const HEADER_KEYWORDS = ['nome','paciente','patient','atendimento','protocolo','convenio','plano','operadora','data','medico','pagar','repasse','honorario','valor'];
      let headerRowIdx = 0, bestScore = -1;
      for(let i=0; i<Math.min(25, rawRows.length); i++){
        const row = rawRows[i];
        if(!Array.isArray(row)) continue;
        const score = row.filter(cell => HEADER_KEYWORDS.some(kw => nn(cell).replace(/\s+/g,'').includes(kw))).length;
        if(score > bestScore){ bestScore = score; headerRowIdx = i; }
      }
      const rawHeaders = rawRows[headerRowIdx].map(h => String(h||'').trim());
      const seenHeaders = {};
      const uniqueHeaders = rawHeaders.map(h => {
        if(!h) return h;
        if(!seenHeaders[h]){ seenHeaders[h] = 1; return h; }
        seenHeaders[h]++;
        return `${h}_${seenHeaders[h]}`;
      });
      const rows = rawRows.slice(headerRowIdx + 1)
        .filter(r => Array.isArray(r) && r.some(c => String(c||'').trim() !== ''))
        .map(r => {
          const obj = {};
          uniqueHeaders.forEach((h, idx) => { if(h) obj[h] = r[idx] !== undefined ? r[idx] : ''; });
          return obj;
        });
      
      // Detecta coluna de valor pago na planilha
      const colsValor = ['r$ a pagar','a pagar','rapagar','valor pago','vl.repasse','vl repasse','vlrepasse','repasse','valor repasse','honorarios','honorários','vlr pago','vlr.pago'];
      const detectarColValor = (row) => {
        const keys = Object.keys(row);
        return keys.find(k => colsValor.includes(nn(k)));
      };
      const colValor = rows.length ? detectarColValor(rows[0]) : null;

      // Detecta coluna de data na planilha (para desambiguar pacientes com nome repetido)
      const colsData = ['data','data atendimento','data do atendimento','date'];
      const detectarColData = (row) => {
        const keys = Object.keys(row);
        return keys.find(k => colsData.includes(nn(k)));
      };
      const colData = rows.length ? detectarColData(rows[0]) : null;
      
      // Função para extrair valor numérico da célula
      const extrairValor = (v) => {
        if(!v) return null;
        const s = String(v).replace(/R\$\s*/gi,'').replace(/\./g,'').replace(',','.').trim();
        const n = parseFloat(s);
        return isNaN(n) ? null : n;
      };

      // Filtra pendentes pelo período de data se definido
      let pendsFiltrados = pends;
      if(state.concilPeriodoInicio || state.concilPeriodoFim){
        pendsFiltrados = pends.filter(p=>{
          if(!p.data) return true;
          const parts = p.data.split('-');
          const dataP = parts.length===3 ? p.data : null;
          if(!dataP) return true;
          if(state.concilPeriodoInicio && dataP < state.concilPeriodoInicio) return false;
          if(state.concilPeriodoFim && dataP > state.concilPeriodoFim) return false;
          return true;
        });
        if(pendsFiltrados.length < pends.length)
          toast(`Filtro de período: ${pendsFiltrados.length} de ${pends.length} pacientes no período`,'info');
      }

      const encontrarMatchExcel = (p) => {
        // 1) Nº de atendimento é chave única
        const porAtendimento = rows.find(r=>Object.values(r).map(v=>String(v||'')).some(v=>v===p.atendimento && p.atendimento));
        if(porAtendimento) return porAtendimento;
        // 2) Nome — pode haver múltiplas linhas com o mesmo nome (datas diferentes)
        const candidatosPorNome = rows.filter(r=>Object.values(r).map(v=>String(v||'')).some(v=>nn(v)===nn(p.nome)&&v.length>3));
        if(candidatosPorNome.length===0) return null;
        if(candidatosPorNome.length===1) return candidatosPorNome[0];
        if(colData){
          const porNomeEData = candidatosPorNome.find(r=>datasBatem(p.data, r[colData])===true);
          if(porNomeEData) return porNomeEData;
          console.warn(`[MedReconcile] "${p.nome}" aparece ${candidatosPorNome.length}x na planilha e nenhuma data bateu com o cadastro local (${p.data}). Pulando para evitar valor errado — confira manualmente.`);
          return null;
        }
        // Sem coluna de data detectada na planilha: mantém comportamento antigo (pega a primeira)
        console.warn(`[MedReconcile] "${p.nome}" aparece ${candidatosPorNome.length}x na planilha e não há coluna de data para desambiguar — usando a primeira ocorrência.`);
        return candidatosPorNome[0];
      };

      // Valida se a data do ATENDIMENTO NA PLANILHA (não a data local cadastrada)
      // está dentro do período selecionado — mesma proteção já aplicada no fluxo
      // de PDF (v59): sem isso, um paciente pendente com data local dentro do
      // período pode "pegar carona" numa linha da planilha cuja data real é de
      // fora do período, só porque o nome ou atendimento coincidiu.
      const dataDaLinhaDentroDoPeriodo = (rowMatch) => {
        if(!state.concilPeriodoInicio && !state.concilPeriodoFim) return true;
        if(!rowMatch || !colData) return true; // sem coluna de data na planilha, não dá pra checar
        const dataLinha = normalizarDataParaComparacao(rowMatch[colData]);
        if(!dataLinha) return true; // não deu pra normalizar, não bloqueia por segurança
        if(state.concilPeriodoInicio && dataLinha < state.concilPeriodoInicio) return false;
        if(state.concilPeriodoFim && dataLinha > state.concilPeriodoFim) return false;
        return true;
      };

      const encontrados = pendsFiltrados.filter(p=>{
        const m = encontrarMatchExcel(p);
        return m && dataDaLinhaDentroDoPeriodo(m);
      });
      state.concilPreview = encontrados.map(p=>{
        // Tenta encontrar o valor pago na linha correspondente da planilha
        const rowMatch = encontrarMatchExcel(p);
        const valorDaPlanilha = rowMatch && colValor ? extrairValor(rowMatch[colValor]) : null;
        const dataDaPlanilha = rowMatch && colData ? normalizarDataParaComparacao(rowMatch[colData]) : null;
        return {...p, status:'PAGO', valorPago: valorDaPlanilha !== null ? valorDaPlanilha : p.valor, dataAtendimentoRelatorio: dataDaPlanilha};
      });
      
      if(colValor) toast(`Coluna de valor encontrada: "${colValor}"`, 'info');
      render();
      if(encontrados.length){
        toast(`${encontrados.length} pacientes encontrados — confirme abaixo`,'success');
      } else {
        console.log('[MedReconcile] Diagnóstico — nenhum paciente encontrado:', {
          linhasNaPlanilha: rows.length,
          colunaNomeDetectada: colNome,
          colunaAtendimentoDetectada: colAtd,
          colunaConvenioDetectada: colConv,
          colunaDataDetectada: colData,
          colunaValorDetectada: colValor,
          pacientesLocaisNoHospital: pends.length,
          pacientesLocaisNoPeriodo: pendsFiltrados.length,
          periodoSelecionado: {inicio: state.concilPeriodoInicio, fim: state.concilPeriodoFim},
          amostraPrimeiraLinhaLida: rows[0],
          amostraPrimeiroPendente: pendsFiltrados[0]
        });
        toast(`Nenhum paciente encontrado. Lidas ${rows.length} linhas da planilha, ${pendsFiltrados.length} pacientes pendentes no período — nenhum bateu. Veja o console para detalhes.`,'error');
      }
    } catch(e) { toast('Erro ao ler planilha: '+(e?.message||'motivo desconhecido'),'error'); console.error('[MedReconcile] Erro no import de planilha:', e); }
    return;
  }
  
  // PDF/Foto: envia para Audit AI
  showProcessingOverlay('Analisando relatório com IA...');
  try {
    const base64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const csv = pends.map(p=>`${p.nome} | Atendimento: ${p.atendimento}`).join('\n');
    const nomeMedico = (state.profile?.name||'').replace(/^(dr\.?|dra\.?)\s+/i,'').trim();
    const response = await fetch(`${AI_URL}${AI_ROUTES.extract}`, {
      method: 'POST',
      headers: {'Accept':'application/json','Content-Type':'application/json','x-api-key':AI_KEY},
      body: JSON.stringify({
        fileBase64: base64,
        filename: file.name || 'relatorio.pdf',
        mimeType: file.type||'application/pdf',
        prompt: `Este é um relatório de repasse médico hospitalar (formato SOULMV, ORTTRAM ou similar). A tabela tem colunas como: Conta | Atendimento | Paciente | Atividade | Convênio | Data | Valor.

${nomeMedico ? `Nome do médico cadastrado: ${nomeMedico}` : ''}

IMPORTANTE: extraia APENAS os registros onde a coluna "Atividade" seja "CLINICO" (ignore CIRURGICO, AMBULATORIAL ou outras atividades).

Para cada paciente com atividade CLINICO encontrado no relatório, extraia:
- nome_paciente: nome completo do paciente
- numero_atendimento: número do atendimento (coluna "Atendimento")
- convenio: nome do convênio
- data_atendimento: data no formato DD/MM/AA ou DD/MM/AAAA
- valor: valor do repasse/pagamento daquela linha, se disponível (coluna Vl.R ou similar), como número decimal sem "R$"

Aqui está a lista de pacientes já cadastrados no meu sistema que preciso verificar se aparecem no relatório (compare por nome ou número de atendimento):
${csv}

Retorne TODOS os pacientes com atividade CLINICO que você encontrar no relatório, mesmo que não estejam na minha lista acima — vou fazer o cruzamento depois. Retorne no formato JSON: {resultados: [{nome_paciente, numero_atendimento, convenio, data_atendimento, valor}]}`,
        schema:{type:'object',properties:{resultados:{type:'array',items:{type:'object',properties:{nome_paciente:{type:'string'},numero_atendimento:{type:'string'},convenio:{type:'string'},data_atendimento:{type:'string'},valor:{type:'number'}}}}}}
      })
    });
    if(!response.ok) throw new Error('Erro '+response.status);
    const data = await response.json();
    const a = data.analysis || data.data || data;
    const resultados = a.resultados || a.results || [];
    console.log('[MedReconcile] Relatório PDF - registros CLINICO encontrados:', resultados.length);

    const nn = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();

    let pendsFiltPdf = pends;
    if(state.concilPeriodoInicio || state.concilPeriodoFim){
      pendsFiltPdf = pends.filter(p=>{
        if(!p.data) return true;
        const parts = p.data.split('-');
        const dataP = parts.length===3 ? p.data : null;
        if(!dataP) return true;
        if(state.concilPeriodoInicio && dataP < state.concilPeriodoInicio) return false;
        if(state.concilPeriodoFim && dataP > state.concilPeriodoFim) return false;
        return true;
      });
    }

    // Cruza pacientes pendentes com os resultados do relatório.
    // Prioridade: 1) nº de atendimento (é único, não precisa de data). 
    // 2) nome + data batendo (desambigua quando o mesmo nome aparece 2x no relatório).
    // 3) só nome, como último recurso (mantém comportamento antigo se não der pra comparar datas).
    function encontrarMatch(p){
      // 1) Atendimento é chave única — se bater, não precisa checar mais nada
      const porAtendimento = resultados.find(r=>r.numero_atendimento && p.atendimento && String(r.numero_atendimento)===String(p.atendimento));
      if(porAtendimento) return porAtendimento;
      // 2) Nome batendo — pode haver múltiplas ocorrências do mesmo nome no relatório (datas diferentes)
      const candidatosPorNome = resultados.filter(r=>r.nome_paciente && p.nome && nn(r.nome_paciente)===nn(p.nome));
      if(candidatosPorNome.length===0) return null;
      if(candidatosPorNome.length===1) return candidatosPorNome[0];
      // Múltiplos candidatos com mesmo nome: desambigua pela data do atendimento
      const porNomeEData = candidatosPorNome.find(r=>datasBatem(p.data, r.data_atendimento)===true);
      if(porNomeEData) return porNomeEData;
      // Nenhuma data bateu (ou não deu pra comparar) — não arrisca escolher errado entre múltiplos
      console.warn(`[MedReconcile] "${p.nome}" aparece ${candidatosPorNome.length}x no relatório e nenhuma data bateu com o cadastro local (${p.data}). Pulando este paciente para evitar valor/data errado — confira manualmente.`);
      return null;
    }

    // Valida se a data do ATENDIMENTO NO RELATÓRIO (não a data local cadastrada)
    // está dentro do período selecionado. Sem isso, um paciente pendente com data
    // local dentro do período pode "pegar carona" num registro do relatório cuja
    // data de atendimento real é de outro mês (ex: relatório de fev-mai batendo
    // com um filtro de junho, só porque o nº de atendimento ou nome coincidiu).
    function dataDoMatchDentroDoPeriodo(match){
      if(!state.concilPeriodoInicio && !state.concilPeriodoFim) return true; // sem filtro, aceita tudo
      if(!match || !match.data_atendimento) return true; // sem data no relatório, não dá pra checar — mantém comportamento antigo
      const dataMatch = normalizarDataParaComparacao(match.data_atendimento);
      if(!dataMatch) return true; // não deu pra normalizar, não bloqueia por segurança
      if(state.concilPeriodoInicio && dataMatch < state.concilPeriodoInicio) return false;
      if(state.concilPeriodoFim && dataMatch > state.concilPeriodoFim) return false;
      return true;
    }

    const encontrados = pendsFiltPdf.filter(p=>{
      const match = encontrarMatch(p);
      return match && dataDoMatchDentroDoPeriodo(match);
    });
    state.concilPreview = encontrados.map(p=>{
      const match = encontrarMatch(p);
      const dataDoRelatorio = match && match.data_atendimento ? normalizarDataParaComparacao(match.data_atendimento) : null;
      return {...p, status:'PAGO', valorPago: (match && match.valor) ? match.valor : p.valor, dataAtendimentoRelatorio: dataDoRelatorio};
    });
    render();
    if(encontrados.length) toast(`${encontrados.length} pacientes CLINICO encontrados — confirme abaixo`,'success');
    else toast(`Relatório lido (${resultados.length} registros CLINICO), mas nenhum bateu com seus pacientes pendentes. Verifique nomes/atendimentos.`,'error');
  } catch(e) {
    console.error('[MedReconcile] Erro ao processar relatório PDF:', e);
    let msg = 'Erro ao processar relatório: ' + (e?.message || 'motivo desconhecido');
    if(e?.name === 'AbortError' || /timeout/i.test(e?.message||'')) {
      msg = 'O relatório demorou demais pra ser lido (timeout). Tente um arquivo menor, ou Excel/CSV.';
    } else if(/Erro 5\d\d/.test(e?.message||'')) {
      msg = 'O servidor de IA está com problema no momento (erro '+(e.message.match(/\d{3}/)?.[0]||'')+'). Tente novamente em alguns minutos.';
    } else if(/Erro 4\d\d/.test(e?.message||'')) {
      msg = 'Falha ao enviar o relatório (erro '+(e.message.match(/\d{3}/)?.[0]||'')+'). Tente Excel/CSV, ou avise o suporte.';
    }
    toast(msg,'error');
  } finally {
    hideProcessingOverlay();
  }
}
function showManualConcil(){
  state.showManualConcil = !state.showManualConcil;
  state.concilPreview = null;
  render();
}
function markPaidManual(id){
  state.patients = state.patients.map(p=>p.id===id?{...p,status:'PAGO',valorPago:p.valor}:p);
  render();
  toast('✓ Marcado como pago','success');
}
function confirmConcil(){
  if(!state.concilPreview) return;
  // Salva snapshot dos pacientes afetados antes de alterar (para reversão)
  const ids = state.concilPreview.map(p=>p.id);
  state.ultimaConcil = state.patients
    .filter(p=>ids.includes(p.id))
    .map(p=>({...p})); // cópia profunda
  state.concilPreview.forEach(p=>{
    state.patients=state.patients.map(x=>x.id===p.id?{...x,status:'PAGO',valorPago:p.valorPago||x.valor}:x);
  });
  state.concilPreview=null;
  saveState();
  render();
  toast(`✓ Conciliação efetivada! Para desfazer, use "Reverter última conciliação".`,'success');
}

function reverterPaciente(id){
  state.patients = state.patients.map(p=>p.id===id?{...p,status:'PENDENTE',valorPago:0}:p);
  saveState();render();
  toast('↩ Paciente revertido para pendente','info');
}

function reverterConcil(){
  if(!state.ultimaConcil) return;
  const ids = state.ultimaConcil.map(p=>p.id);
  state.patients = state.patients.map(p=>{
    const original = state.ultimaConcil.find(u=>u.id===p.id);
    return original ? {...original} : p;
  });
  const n = state.ultimaConcil.length;
  state.ultimaConcil = null;
  saveState();
  render();
  toast(`↩ ${n} pacientes revertidos para o estado anterior à conciliação`,'info');
}

      return p;

}

function renderConfig(){
  // Auto-verifica conexão ao abrir ajustes
  setTimeout(()=>checkIAStatus(), 500);
  const allPats = state.patients;
  const hoje = new Date();
  const mesAtual = `${String(hoje.getMonth()+1).padStart(2,'0')}/${hoje.getFullYear()}`;

  // ── MÉDIA HISTÓRICA ACUMULADA POR CONVÊNIO ──────────────────────────────────
  // Para cada convênio: soma todos os valores pagos (histórico) ÷ total de pacientes pagos
  // Só considera pacientes PAGO (valores confirmados pelo hospital)
  const CONVENIOS_LIST = ['Unimed','Amil','Bradesco Saúde','SulAmérica','Porto Seguro',
    'Prevent Senior','NotreDame Intermédica','Hapvida','Particular','Outro'];

  const mediaConvenio = {};
  CONVENIOS_LIST.forEach(conv => {
    // Todos os pacientes pagos deste convênio em todos os meses/unidades
    const pagosConv = allPats.filter(a => a.convenio === conv && a.status === 'PAGO');
    if(pagosConv.length > 0){
      const totalRecebido = pagosConv.reduce((s,a) => s + (a.valorPago || a.valor || 0), 0);
      mediaConvenio[conv] = totalRecebido / pagosConv.length; // média histórica por paciente
    } else {
      mediaConvenio[conv] = null; // sem histórico ainda
    }
  });

  // Pacientes do mês atual
  const patsMes = allPats.filter(a => {
    if(!a.data) return false;
    const parts = a.data.split('-');
    let mm, yyyy;
    if(parts.length===3){mm=parts[1];yyyy=parts[0];}
    else{const d=new Date(a.data);mm=String(d.getMonth()+1).padStart(2,'0');yyyy=String(d.getFullYear());}
    return `${mm}/${yyyy}` === mesAtual;
  });

  // Estimativa do mês = para cada paciente do mês, aplica a média histórica do convênio
  // Se não houver histórico do convênio, não inclui na estimativa
  let estimadoMes = 0;
  const semHistorico = [];
  patsMes.forEach(a => {
    const media = mediaConvenio[a.convenio];
    if(media != null) estimadoMes += media;
    else if(a.convenio && !semHistorico.includes(a.convenio)) semHistorico.push(a.convenio);
  });

  // Detalhamento por unidade
  const porUnidade = state.hospitals.map(h => {
    const pats = patsMes.filter(p=>p.hospId===h.id);
    let est = 0;
    pats.forEach(a => { if(mediaConvenio[a.convenio]!=null) est += mediaConvenio[a.convenio]; });
    return {name:h.name, pats:pats.length, est};
  }).filter(u=>u.pats>0);

  // Breakdown por convênio no mês atual (para exibir detalhes)
  const convMes = CONVENIOS_LIST.map(conv => {
    const pats = patsMes.filter(a=>a.convenio===conv);
    if(!pats.length) return null;
    const media = mediaConvenio[conv];
    const est = media!=null ? media*pats.length : null;
    const histPats = allPats.filter(a=>a.convenio===conv&&a.status==='PAGO').length;
    return {conv, pats:pats.length, media, est, histPats};

      <div style="width:80px;height:80px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,0.82),rgba(255,255,255,0.55));

        <div style="background:rgba(255,255,255,0.52);border-radius:14px;padding:12px 14px;">
          <div class="lbl" style="margin-bottom:4px;">Pacientes em ${mesAtual}</div>
          <div style="font-size:22px;font-weight:900;color:var(--text);">${patsMes.length}</div>
        </div>
        <div style="background:rgba(46,200,102,0.10);border-radius:14px;padding:12px 14px;border:1px solid rgba(46,200,102,0.18);">
          <div class="lbl" style="margin-bottom:4px;">Estimado ${mesAtual}</div>
          <div style="font-size:16px;font-weight:900;color:var(--green2);">${fmtBRL(estimadoMes)}</div>
        </div>

      <div style="padding:14px 18px;background:rgba(46,200,102,0.05);border-top:2px solid rgba(46,200,102,0.15);display:flex;justify-content:space-between;align-items:center;">

async function registrarBiometria(){
  if(!window.PublicKeyCredential){ toast('Biometria não suportada neste navegador','error'); return; }
  try{
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const userId = new Uint8Array(16);
    crypto.getRandomValues(userId);

    // Se já existir uma credencial salva localmente, exclui ela da criação
    // pra evitar duplicar no gerenciador de passkeys do dispositivo.
    const excludeCredentials = [];
    const credIdExistente = localStorage.getItem('biometria_credId');
    if(credIdExistente){
      try{
        const bin = atob(credIdExistente);
        const bytes = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
        excludeCredentials.push({type:'public-key', id: bytes});
      }catch(_){}
    }

    const credential = await navigator.credentials.create({
      publicKey:{
        challenge,
        rp:{ name:'MedReconcile', id: location.hostname },
        user:{ id: userId, name: state.profile?.email||'medreconcile', displayName: state.profile?.name||'Médico' },
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{
          authenticatorAttachment:'platform',
          userVerification:'required',
          residentKey:'required'
        },
        excludeCredentials,
        timeout: 60000
      }
    });

    if(credential){
      localStorage.setItem('biometria_registrada','1');
      localStorage.setItem('biometria_credId', btoa(String.fromCharCode(...new Uint8Array(credential.rawId))));
      toast('✓ Biometria ativada com sucesso!','success');
      render();
    }
  }catch(e){
    if(e.name==='NotAllowedError') toast('Biometria cancelada pelo usuário','info');
    else if(e.name==='InvalidStateError') toast('Essa biometria já está cadastrada neste dispositivo','info');
    else toast('Erro ao registrar biometria: '+e.message,'error');
  }
}

async function autenticarBiometria(){
  if(!window.PublicKeyCredential){ toast('Biometria não suportada neste navegador','error'); return; }
  try{
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);

    // Especifica exatamente qual credencial usar (a salva localmente),
    // evitando ambiguidade se houver mais de uma cadastrada no dispositivo.
    const allowCredentials = [];
    const credIdSalvo = localStorage.getItem('biometria_credId');
    if(credIdSalvo){
      try{
        const bin = atob(credIdSalvo);
        const bytes = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
        allowCredentials.push({type:'public-key', id: bytes});
      }catch(_){}
    }

    const assertion = await navigator.credentials.get({
      publicKey:{
        challenge,
        rpId: location.hostname,
        userVerification:'required',
        allowCredentials,
        timeout: 60000
      }
    });

    if(assertion){
      pinInput='';
      document.getElementById('pin-screen').style.display='none';
      document.getElementById('app').style.display='block';
      state.activeTab='inicio';
      navStack=['tab:inicio'];
      try{ history.replaceState({navAnchor:true,base:true},'',location.href); }catch(_){}
      showTab('inicio');
      toast('✓ Acesso liberado por biometria','success');
    }
  }catch(e){
    if(e.name==='NotAllowedError') toast('Biometria cancelada — use o PIN','info');
    else toast('Falha na biometria — use o PIN','error');
  }
}

function desativarBiometria(){

function trocarPin(){
  const pinAtual = document.getElementById('pin-atual')?.value?.trim();
  const pinNovo = document.getElementById('pin-novo')?.value?.trim();
  const pinConfirma = document.getElementById('pin-confirma')?.value?.trim();
  const correctPin = state.profile?.appPassword || '1234';

  if(!pinAtual || !pinNovo || !pinConfirma){
    toast('Preencha todos os campos de PIN','error'); return;
  }
  if(pinAtual !== correctPin){
    toast('PIN atual incorreto','error'); return;
  }
  if(pinNovo.length !== 4 || !/^\d{4}$/.test(pinNovo)){
    toast('O novo PIN deve ter exatamente 4 dígitos','error'); return;
  }
  if(pinNovo !== pinConfirma){
    toast('Os PINs não coincidem','error'); return;
  }

  state.profile.appPassword = pinNovo;
  CORRECT_PIN = pinNovo;
  saveState();
  saveProfile();
  toast('✓ PIN alterado com sucesso!','success');
  document.getElementById('pin-atual').value = '';
  document.getElementById('pin-novo').value = '';
  document.getElementById('pin-confirma').value = '';
}

function saveProfile(){
  const nome = document.getElementById('prof-nome')?.value.trim();
  const crm  = document.getElementById('prof-crm')?.value.trim();
  const esp  = document.getElementById('prof-esp')?.value.trim();
  const email= document.getElementById('prof-email')?.value.trim();
  if(!nome){ toast('Nome obrigatório','error'); return; }
  state.profile.name = nome;
  state.profile.crm  = crm;
  state.profile.especialidade = esp;
  if(email) state.profile.email = email;
  const descontoVal = parseFloat(document.getElementById('prof-desconto')?.value||'0')||0;
  state.profile.descontoPercent = descontoVal >= 0 && descontoVal <= 100 ? descontoVal : 0;
  saveState(); // Persiste no localStorage
  render();
  toast('Perfil salvo!','success');
}
async function buildMedReconcileWorkbook(XLSX){
  const wb = XLSX.utils.book_new();
  const headers = ['Paciente','Nº Atendimento','Convênio','Data Atendimento','Status','Médico','CRM'];

  state.hospitals.forEach(hosp => {
    const pats = state.patients.filter(p => p.hospId === hosp.id);
    const rows = pats.map(p => ({
      'Paciente': p.nome || '',
      'Nº Atendimento': p.atendimento || '',
      'Convênio': p.convenio || '',
      'Data Atendimento': p.data ? new Date(p.data).toLocaleDateString('pt-BR') : '',
      'Status': p.status === 'PAGO' ? 'PAGO' : 'PENDENTE',
      'Médico': state.profile.name || '',
      'CRM': state.profile.crm || ''
    }));

    if(rows.length === 0){
      rows.push({'Paciente':'Sem pacientes cadastrados','Nº Atendimento':'','Convênio':'','Data Atendimento':'','Status':'','Médico':'','CRM':''});
    }

    const ws = XLSX.utils.json_to_sheet(rows, {header: headers});
    ws['!cols'] = [
      {wch:30}, {wch:16}, {wch:20}, {wch:16}, {wch:12}, {wch:25}, {wch:14},
    ];
    const sheetName = hosp.name.substring(0,31).replace(/[\/:*?\[\]]/g,'');
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  const resumo = state.patients.map(p => {
    const h = state.hospitals.find(h=>h.id===p.hospId);
    return {
      'Hospital': h ? h.name : '',
      'Paciente': p.nome || '',
      'Nº Atendimento': p.atendimento || '',
      'Convênio': p.convenio || '',
      'Data Atendimento': p.data ? new Date(p.data).toLocaleDateString('pt-BR') : '',
      'Status': p.status === 'PAGO' ? 'PAGO' : 'PENDENTE',
    };
  });
  const wsResumo = XLSX.utils.json_to_sheet(resumo.length ? resumo : [{'Hospital':'Sem dados'}]);
  wsResumo['!cols'] = [{wch:25},{wch:30},{wch:16},{wch:20},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo Geral');

  return wb;
}

async function uploadBackupToDrive(token){
  const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs');

  const wb = await buildMedReconcileWorkbook(XLSX);
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob = new Blob([buf], {type:mimeType});

  const name = `Backup_MedReconcile_${today()}.xlsx`;
  const metadata = {name, mimeType};

  // FormData nativo: o navegador monta o multipart/boundary automaticamente,
  // mais robusto do que montar o Blob multipart manualmente.
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
  form.append('file', blob);

  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method:'POST',
    headers:{'Authorization':`Bearer ${token}`},
    body: form
  });
  return res;
}

async function backupToDrive(){
  const btn = document.getElementById('drive-backup-btn');
  const txt = document.getElementById('drive-backup-text');

  if(!state.patients.length){ toast('Nenhum paciente para exportar','error'); return; }

  const ok = await ensureDriveAccess();
  if(!ok) return;

  let token = window.getDriveToken();
  if(!token){ toast('Não foi possível obter acesso ao Drive','error'); return; }

  try{
    if(btn) btn.disabled = true;
    if(txt) txt.textContent = '⏳ Preparando backup...';
    toast('⏳ Preparando backup...','info');

    if(txt) txt.textContent = '⏳ Enviando para o Drive...';
    let res = await uploadBackupToDrive(token);

    // Token pode ter expirado (sessão antiga salva no celular): limpa e tenta de novo com novo login
    if(!res.ok && (res.status===401 || res.status===403)){
      window.setDriveToken(null);
      toast('Sessão do Drive expirada, reconectando...','info');
      const reconnected = await ensureDriveAccess();
      if(!reconnected) throw new Error('Não foi possível reconectar ao Drive');
      token = window.getDriveToken();
      if(!token) throw new Error('Token não disponível após reconexão');
      res = await uploadBackupToDrive(token);
    }

    if(!res.ok){
      throw new Error('O Google Drive recusou o envio (código '+res.status+'). Tente novamente em alguns instantes.');
    }

    toast('✓ Backup salvo no Google Drive!','success');
  }catch(e){
    console.error(e);
    const msg = (e && e.message && e.message.toLowerCase().includes('fetch'))
      ? 'Falha de conexão ao enviar para o Drive. Verifique sua internet e tente novamente.'
      : ('Erro ao enviar para o Drive: '+(e.message||'desconhecido'));
    toast(msg,'error');
  }finally{
    if(btn) btn.disabled = false;
    if(txt) txt.textContent = 'Salvar no Google Drive';
  }
}

async function loginEmail(action){
  const email = document.getElementById('login-email')?.value.trim();
  const pass  = document.getElementById('login-pass')?.value;
  const errDiv = document.getElementById('login-error');

  if(action==='reset'){
    if(!email){ if(errDiv){errDiv.style.display='block';errDiv.textContent='Digite seu e-mail primeiro.';} return; }
    try{
      const {sendPasswordResetEmail} = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
      await sendPasswordResetEmail(window.fbAuth, email);
      if(errDiv){errDiv.style.display='block';errDiv.style.color='var(--green2)';errDiv.textContent='Link enviado! Verifique seu e-mail.';}
    }catch(e){ if(errDiv){errDiv.style.display='block';errDiv.style.color='var(--red)';errDiv.textContent=e.message;} }
    return;
  }

  if(!email||!pass){ if(errDiv){errDiv.style.display='block';errDiv.textContent='Preencha e-mail e senha.';} return; }

  try{
    const {signInWithEmailAndPassword, createUserWithEmailAndPassword} = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    let result;
    if(action==='register'){
      result = await createUserWithEmailAndPassword(window.fbAuth, email, pass);
    } else {
      result = await signInWithEmailAndPassword(window.fbAuth, email, pass);
    }
    window.currentUser = result.user;
    await loadUserData(result.user.uid);
    document.getElementById('login-screen').style.display='none';
    showPinOrApp();
  }catch(e){
    if(errDiv){
      errDiv.style.display='block';
      errDiv.style.color='var(--red)';
      if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') errDiv.textContent='Senha incorreta.';
      else if(e.code==='auth/user-not-found') errDiv.textContent='E-mail não cadastrado.';
      else if(e.code==='auth/email-already-in-use') errDiv.textContent='E-mail já cadastrado. Faça login.';
      else if(e.code==='auth/weak-password') errDiv.textContent='Senha fraca — mínimo 6 caracteres.';
      else errDiv.textContent = e.message;
    }
  }
}

async function loginGoogle(){

// Rastreia se existem mudanças locais que AINDA não foram confirmadas como
// salvas na nuvem. Enquanto isso for verdade, loadUserData() não pode
// sobrescrever patients/hospitals com o que vier da nuvem — senão uma
// mudança recente (que ainda não "pegou" lá) pode ser revertida sem aviso.
let versaoSalvaPendente = 0;
let versaoConfirmadaNaNuvem = 0;
let tentativaDeSalvarAgendada = null;
let tentativasDeSalvarSeguidas = 0;
let tentativaDeCarregarAgendada = null;
let tentativasDeCarregarSeguidas = 0;
let cargaInicialConcluida = false; // ver saveToFirebase() — trava de segurança contra sobrescrever dados reais
window.ultimoErroSalvamento = null; // usado pelo indicador visual na tela

async function loadUserData(uid){
  if(!window.fbLoadData) return;
  try{
    const data = await window.fbLoadData(uid);
    if(data){
      const temMudancaLocalNaoConfirmada = versaoSalvaPendente > versaoConfirmadaNaNuvem;
      if(data.hospitals && !temMudancaLocalNaoConfirmada) state.hospitals = data.hospitals;
      if(data.patients  && !temMudancaLocalNaoConfirmada) state.patients  = data.patients;
      if(temMudancaLocalNaoConfirmada){
        console.warn('[MedReconcile] Existem mudanças locais ainda não confirmadas na nuvem — pulando sobrescrita de patients/hospitals para não perder dado recente.');
      }
      if(data.profile){
        // O PIN (appPassword) é uma configuração de SEGURANÇA DO DISPOSITIVO,
        // não deve ser sobrescrito pelo que está salvo na nuvem — evita que o
        // app reverta pro PIN antigo se a sincronização estiver atrasada, ou
        // se o PIN foi trocado num dispositivo diferente.
        const pinLocalAtual = state.profile?.appPassword;
        state.profile = data.profile;
        if(pinLocalAtual) state.profile.appPassword = pinLocalAtual;
      }
      if(data.activeHosp) state.activeHosp = data.activeHosp;
    }
    cargaInicialConcluida = true;
    tentativasDeCarregarSeguidas = 0;
    if(tentativaDeCarregarAgendada){ clearTimeout(tentativaDeCarregarAgendada); tentativaDeCarregarAgendada = null; }
    if(window.ultimoErroSalvamento && window.ultimoErroSalvamento.tipo === 'carregar'){
      window.ultimoErroSalvamento = null;
      render();
    }
  }catch(e){
    console.error('Erro ao carregar dados:', e);
    tentativasDeCarregarSeguidas++;
    // Uma falha ao CARREGAR é tão grave quanto uma falha ao salvar — antes
    // ficava completamente invisível pro usuário. Agora mostra o mesmo aviso
    // persistente na tela e tenta de novo sozinho.
    window.ultimoErroSalvamento = { mensagem: (e && e.message) || 'motivo desconhecido', em: new Date().toISOString(), tipo: 'carregar' };
    if(tentativasDeCarregarSeguidas <= 5){
      if(tentativaDeCarregarAgendada) clearTimeout(tentativaDeCarregarAgendada);
      tentativaDeCarregarAgendada = setTimeout(() => { loadUserData(uid); }, 8000);
    }
    render();
  }
}

async function saveToFirebase(){
  if(!window.currentUser || !window.fbSaveData) return;
  if(!cargaInicialConcluida){
    // Proteção crítica: nunca escrever na nuvem antes do primeiro carregamento
    // ter sido confirmado com sucesso. Sem isso, um estado local incompleto
    // (ex: carregamento que falhou) poderia sobrescrever dados reais na nuvem
    // com uma lista vazia ou parcial — perda de dados de verdade, não só de
    // exibição. Enfileira e tenta de novo em breve, sem salvar agora.
    console.warn('[MedReconcile] Bloqueando salvamento: carregamento inicial ainda não confirmado. Tentando de novo em breve.');
    if(!tentativaDeSalvarAgendada){
      tentativaDeSalvarAgendada = setTimeout(() => { tentativaDeSalvarAgendada = null; saveToFirebase(); }, 5000);
    }
    return;
  }
  const minhaVersao = ++versaoSalvaPendente;
  try{
    await window.fbSaveData(window.currentUser.uid, {
      hospitals: state.hospitals,
      patients:  state.patients,
      profile:   state.profile,
      activeHosp: state.activeHosp
    });
    if(minhaVersao > versaoConfirmadaNaNuvem) versaoConfirmadaNaNuvem = minhaVersao;
    if(tentativaDeSalvarAgendada){ clearTimeout(tentativaDeSalvarAgendada); tentativaDeSalvarAgendada = null; }
    tentativasDeSalvarSeguidas = 0;
    if(window.ultimoErroSalvamento){ window.ultimoErroSalvamento = null; render(); }
  }catch(e){
    console.error('Erro ao salvar:', e);
    tentativasDeSalvarSeguidas++;
    const mensagemErro = e && e.message ? e.message : 'motivo desconhecido';
    const ehErroPermanente = /permission|unauthorized|denied/i.test(mensagemErro);
    window.ultimoErroSalvamento = { mensagem: mensagemErro, em: new Date().toISOString(), permanente: ehErroPermanente };

    if(ehErroPermanente || tentativasDeSalvarSeguidas >= 5){
      // Não adianta ficar tentando de novo sozinho — mostra aviso persistente
      // na tela (não some como um toast) até o usuário tentar manualmente.
      toast('Não foi possível salvar seus dados na nuvem. Veja o aviso na tela inicial.', 'error');
      render();
    } else {
      toast('Falha ao salvar na nuvem — tentando de novo em instantes.', 'error');
      if(tentativaDeSalvarAgendada) clearTimeout(tentativaDeSalvarAgendada);
      tentativaDeSalvarAgendada = setTimeout(() => { saveToFirebase(); }, 10000);
    }
  }
}

function tentarSalvarNovamenteManualmente(){
  if(window.ultimoErroSalvamento && window.ultimoErroSalvamento.tipo === 'carregar'){
    tentativasDeCarregarSeguidas = 0;
    if(window.currentUser) loadUserData(window.currentUser.uid);
  } else {
    tentativasDeSalvarSeguidas = 0;
    saveToFirebase();
  }
}

function showPinOrApp(){
  const pin = state.profile.appPassword || '1234';
  if(pin){
    document.getElementById('pin-screen').style.display='block';
    renderPin();
  } else {
    document.getElementById('app').style.display='block';
    state.activeTab='inicio';
    navStack = ['tab:inicio'];
    try{ history.replaceState({navAnchor:true,base:true}, '', location.href); }catch(_){}
    showTab('inicio');
  }
}

function renderPin(err){
  document.getElementById('pin-screen').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;position:relative;">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 20% 20%,rgba(46,200,102,0.08) 0%,transparent 60%);pointer-events:none;"></div>
      <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:340px;">
        <div style="width:88px;height:88px;border-radius:28px;
          background:linear-gradient(145deg,#f0f2f0,#e4e8e5);
          display:flex;align-items:center;justify-content:center;
          margin:0 auto 24px;
          box-shadow:0 20px 48px rgba(0,0,0,0.12),inset 0 2px 0 rgba(255,255,255,0.90),inset 0 -2px 0 rgba(0,0,0,0.06);">
          <svg width="54" height="54" viewBox="0 0 56 56" fill="none">
            <rect x="36" y="8" width="4" height="12" rx="2" fill="#2ec866" opacity="0.9"/>
            <rect x="32" y="12" width="12" height="4" rx="2" fill="#2ec866" opacity="0.9"/>
            <path d="M8 40V18l10 14 10-14v22" stroke="#2ec866" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
            <path d="M30 40V20h8a6 6 0 010 12H30M38 32l8 8" stroke="#2ec866" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
            <circle cx="46" cy="40" r="3" fill="#2ec866" opacity="0.6"/>
          </svg>
        </div>
        <div style="font-size:24px;font-weight:900;color:var(--text);margin-bottom:6px;">Acesso Seguro</div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:28px;font-weight:600;">thifcms@gmail.com</div>
        <div class="glass" style="padding:28px;">
          <div style="display:flex;gap:18px;justify-content:center;margin-bottom:28px;">
            ${[0,1,2,3].map(i=>`<div style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(46,200,102,0.40);transition:all 0.18s;
              ${i<pinInput.length?'background:var(--green);border-color:var(--green);transform:scale(1.2);box-shadow:0 0 8px rgba(46,200,102,0.50);':''}"></div>`).join('')}
          </div>
          ${err?`<div style="color:var(--red);font-size:13px;font-weight:800;margin-bottom:14px;animation:fadeIn .3s ease;">${err}</div>`:''}
          <div class="pin-grid">
            ${['1','2','3','4','5','6','7','8','9','','0','⌫'].map((k,i)=>
              k===''?'<div></div>':
              `<button class="pin-key" onclick="pinTap('${k}')" style="font-size:${k==='⌫'?18:20}px;">${k}</button>`
            ).join('')}
          </div>
        </div>
        <div style="margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px;">
          ${localStorage.getItem('biometria_registrada')==='1'?`
          <button id="btn-biometria" onclick="autenticarBiometria()" style="display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(46,200,102,0.12),rgba(46,200,102,0.06));border:1px solid rgba(46,200,102,0.25);border-radius:16px;padding:12px 24px;color:var(--green2);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">
            🔐 Usar biometria
          </button>`:'<div id="btn-biometria" style="display:none;"></div>'}
          <button onclick="showForgotPin()" style="background:none;border:none;color:var(--green2);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;">
            Esqueci minha senha
          </button>
        </div>
      </div>
    </div>`;
  // Disparo automático da biometria se estiver registrada — só uma vez por
  // sessão do app, pra não ficar repetindo o pedido em loop se a tela de PIN
  // for renderizada de novo por outro motivo (ex: Firebase re-autenticando).
  if(localStorage.getItem('biometria_registrada')==='1' && !biometriaAutoDisparada){
    biometriaAutoDisparada = true;
    setTimeout(()=>{ autenticarBiometria(); }, 600);
  }
}

function showForgotPin(){
  document.getElementById('pin-screen').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;position:relative;">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 20% 20%,rgba(46,200,102,0.08) 0%,transparent 60%);pointer-events:none;"></div>
      <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:340px;">
        <div style="width:72px;height:72px;border-radius:24px;background:linear-gradient(145deg,rgba(46,200,102,0.12),rgba(46,200,102,0.06));display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 24px;border:1px solid rgba(46,200,102,0.18);">🔑</div>
        <div style="font-size:22px;font-weight:900;color:var(--text);margin-bottom:8px;">Recuperar Acesso</div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:32px;font-weight:600;line-height:1.6;">Enviaremos um link de redefinição<br>para o seu e-mail cadastrado.</div>
        <div class="glass" style="padding:28px;text-align:left;">
          <div style="font-size:11px;font-weight:800;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">E-mail</div>
          <input class="input" id="recovery-email" type="email" placeholder="seu@email.com" value="thifcms@gmail.com" style="margin-bottom:16px;">
          <button onclick="sendRecovery()" class="btn-p" style="width:100%;padding:14px;">Enviar link de recuperação</button>
          <button onclick="pinInput='';renderPin()" style="width:100%;padding:12px;margin-top:10px;background:none;border:none;color:var(--text3);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">← Voltar ao PIN</button>
        </div>
      </div>
    </div>`;
}

async function sendRecovery(){
  const email = document.getElementById('recovery-email')?.value?.trim() || '';
  if(!email){ toast('Digite seu e-mail','error'); return; }
  
  // Verifica se o email bate com o email cadastrado no perfil
  const profileEmail = state.profile?.email || '';
  if(profileEmail && email.toLowerCase() !== profileEmail.toLowerCase()){
    document.getElementById('pin-screen').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;">
      <div style="text-align:center;width:100%;max-width:340px;">
        <div style="font-size:42px;margin-bottom:16px;">❌</div>
        <div style="font-size:20px;font-weight:900;color:var(--text);margin-bottom:8px;">E-mail não encontrado</div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:24px;">O e-mail informado não corresponde ao cadastrado neste app.</div>
        <button onclick="showForgotPin()" class="btn-p" style="width:100%;padding:14px;">← Tentar novamente</button>
      </div>
    </div>`;
    return;
  }

  // Envia o PIN atual por Firebase Auth (reset de senha do app via email)
  try{
    const {sendPasswordResetEmail} = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    // Tenta enviar reset pelo Firebase Auth
    await sendPasswordResetEmail(window.fbAuth, email);
  }catch(e){
    // Se não tiver conta Firebase, mostra o PIN diretamente na tela (já que é local)
    console.warn('Firebase reset falhou, mostrando PIN local:', e.message);
  }

  // Mostra o PIN atual salvo localmente (já que o PIN é local, não Firebase)
  const pinAtual = state.profile?.appPassword || '1234';
  
  document.getElementById('pin-screen').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;position:relative;">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 20% 20%,rgba(46,200,102,0.08) 0%,transparent 60%);pointer-events:none;"></div>
      <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:340px;">
        <div style="width:88px;height:88px;border-radius:28px;background:linear-gradient(135deg,rgba(46,200,102,0.12),rgba(46,200,102,0.05));display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 24px;border:1px solid rgba(46,200,102,0.18);">🔑</div>
        <div style="font-size:22px;font-weight:900;color:var(--text);margin-bottom:10px;">Seu PIN de Acesso</div>
        <div style="font-size:13px;color:var(--text3);font-weight:600;line-height:1.7;margin-bottom:20px;">Anote seu PIN e guarde em local seguro.</div>
        <div class="glass" style="padding:28px;margin-bottom:20px;">
          <div style="font-size:11px;font-weight:800;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;">PIN atual</div>
          <div style="font-size:42px;font-weight:900;color:var(--green2);letter-spacing:8px;">${pinAtual}</div>
        </div>
        <button onclick="pinInput='';renderPin()" class="btn-p" style="width:100%;padding:14px;">← Voltar ao PIN</button>
      </div>
    </div>`;
}

function pinTap(k){
  if(k==='⌫'){pinInput=pinInput.slice(0,-1);renderPin();return;}
  pinInput+=k;
  renderPin();
  if(pinInput.length===4){
    if(pinInput===CORRECT_PIN){
      setTimeout(()=>{
        document.getElementById('pin-screen').style.display='none';
        document.getElementById('app').style.display='block';
        state.activeTab='inicio';
        navStack = ['tab:inicio'];
        try{ history.replaceState({navAnchor:true,base:true}, '', location.href); }catch(_){}
        showTab('inicio');
        // Update topbar with user name
        if(window.currentUser && state.profile.name){
          const el = document.getElementById('topbar-subtitle');
          if(el) el.textContent = state.profile.name;
        }
      },200);
    } else {
      setTimeout(()=>{pinInput='';renderPin('PIN incorreto. Tente novamente.');},400);
    }
  }
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    const splash=document.getElementById('splash');
    splash.classList.add('exit');
    setTimeout(()=>{
      splash.style.display='none';
      // Check Firebase auth state
      if(window.fbOnAuth){
        window.fbOnAuth(async (user)=>{
          if(user){
            window.currentUser = user;
            state.profile.email = user.email;
            await loadUserData(user.uid);
            showPinOrApp();
          } else {
            document.getElementById('login-screen').style.display='block';
            renderLoginScreen('main');
          }
        });
      } else {
        setTimeout(()=>{
          if(window.fbOnAuth){
            window.fbOnAuth(async (user)=>{
              if(user){
                window.currentUser = user;
                await loadUserData(user.uid);
                showPinOrApp();
              } else {
                document.getElementById('login-screen').style.display='block';
                renderLoginScreen('main');
              }
            });
          } else {
            document.getElementById('login-screen').style.display='block';
            renderLoginScreen('main');
          }
        }, 1500);
      }
    },550);
  },3200);
});
